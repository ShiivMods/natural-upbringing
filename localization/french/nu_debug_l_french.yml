 nu_debug_test_trait_notification_interaction:0 "Natural Upbringing : Tester le prochain événement de trait"
 nu_debug_test_trait_notification_interaction_desc:0 "Fait défiler les 36 traits de personnalité vanilla et affiche le véritable événement parental Natural Upbringing correspondant au trait suivant. Les traits de l'enfant ne sont pas modifiés."
