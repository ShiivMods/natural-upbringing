 nu_debug_refresh_exposure_interaction_desc:0 "Exécute immédiatement une mise à jour annuelle complète de l'exposition pour ce personnage, quel que soit son âge ou son statut, puis ouvre l'inspecteur."
 nu_debug_force_cultural_acceptance_interaction:0 "Natural Upbringing : Forcer un tick d'acceptation culturelle"
