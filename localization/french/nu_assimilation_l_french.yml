l_french:

 nu_assimilation.0001.t:0 "Des nouvelles de [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0001.desc_rapid:0 "Une lettre de [nu_assimilated_child.GetFirstName] m'est parvenue. Ses lignes débordent d'un enthousiasme presque surprenant pour les usages et les coutumes découverts loin de chez nous. En si peu de temps, ce qui n'était encore qu'un monde étranger semble être devenu le sien.\n\nIl ne fait désormais guère de doute que [nu_assimilated_child.GetFirstName] se considère comme appartenant à la culture [nu_assimilated_child.GetCulture.GetName]."
 nu_assimilation.0001.desc:0 "Les nouvelles de [nu_assimilated_child.GetFirstName] confirment ce que les années laissaient déjà entrevoir. Les habitudes, la langue et les coutumes de son environnement ont progressivement pris racine.\n\n[nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName]."

 nu_assimilation.0002.t:0 "Le rite de [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0002.desc_rapid:0 "Une lettre de [nu_assimilated_child.GetFirstName] m'est parvenue, animée d'une ferveur nouvelle et inattendue. Quelques années à peine auront suffi pour que les croyances découvertes loin de chez nous cessent de lui être étrangères.\n\n[nu_assimilated_child.GetFirstName] suit désormais le rite [nu_religious_assimilation_target.GetName]."
 nu_assimilation.0002.desc:0 "Les lettres de [nu_assimilated_child.GetFirstName] avaient changé depuis quelque temps. Les références, les prières et les convictions qui s'y glissaient annonçaient peu à peu cette évolution.\n\n[nu_assimilated_child.GetFirstName] suit désormais le rite [nu_religious_assimilation_target.GetName]."

 nu_assimilation.0003.t:0 "Une nouvelle identité"
 nu_assimilation.0003.desc_rapid:0 "La dernière lettre de [nu_assimilated_child.GetFirstName] est presque méconnaissable tant l'enthousiasme qui l'habite est vif. En quelques années seulement, les coutumes comme les croyances de son nouvel environnement semblent avoir été pleinement embrassées.\n\n[nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName] et professe la foi [nu_religious_assimilation_target.GetName]."
 nu_assimilation.0003.desc:0 "Avec le temps, les nouvelles de [nu_assimilated_child.GetFirstName] avaient laissé deviner une transformation plus profonde qu'une simple adaptation à une cour étrangère. Ce changement est désormais manifeste.\n\n[nu_assimilated_child.GetFirstName] appartient à la culture [nu_assimilated_child.GetCulture.GetName] et professe la foi [nu_religious_assimilation_target.GetName]."

 nu_assimilation.0001.context_guardian_court_servants:0 "\n\nEt pourtant, même les serviteurs envoyés pour préserver nos usages n'auront pas suffi. Sous la tutelle de [nu_cultural_assimilation_guardian.GetFirstName], à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], cette nouvelle identité a fini par s'imposer."
 nu_assimilation.0001.context_guardian_court:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName], jointe à la vie passée à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], semble avoir profondément façonné [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_court:0 "\n\nLa vie à la cour de [nu_cultural_assimilation_court_owner.GetFirstName] semble avoir profondément façonné [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_guardian:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName] semble avoir joué un rôle déterminant dans cette évolution."

 nu_assimilation.0002.context_guardian_court_attendant:0 "\n\nMême l'accompagnement religieux prévu pour préserver sa foi n'aura pas suffi. Sous la tutelle de [nu_religious_assimilation_guardian.GetFirstName], à la cour de [nu_religious_assimilation_court_owner.GetFirstName], de nouvelles convictions ont fini par prendre racine."
 nu_assimilation.0002.context_guardian_court:0 "\n\nL'influence de [nu_religious_assimilation_guardian.GetFirstName] et la vie à la cour de [nu_religious_assimilation_court_owner.GetFirstName] semblent avoir nourri cette nouvelle foi."
 nu_assimilation.0002.context_court:0 "\n\nLa vie à la cour de [nu_religious_assimilation_court_owner.GetFirstName] semble avoir nourri peu à peu ces nouvelles convictions."
 nu_assimilation.0002.context_guardian:0 "\n\nL'influence de [nu_religious_assimilation_guardian.GetFirstName] semble avoir joué un rôle déterminant dans cette évolution spirituelle."

 nu_assimilation.0003.context_guardian_court:0 "\n\nSous la tutelle de [nu_cultural_assimilation_guardian.GetFirstName], à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], [nu_assimilated_child.GetFirstName] semble avoir trouvé bien davantage qu'un simple lieu d'éducation."
 nu_assimilation.0003.context_court:0 "\n\nLa cour de [nu_cultural_assimilation_court_owner.GetFirstName] semble être devenue pour [nu_assimilated_child.GetFirstName] bien davantage qu'un simple lieu d'éducation."
 nu_assimilation.0003.context_guardian:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName] semble avoir profondément marqué aussi bien les coutumes que les convictions de [nu_assimilated_child.GetFirstName]."

# Réactions dominantes de personnalité
 nu_assimilation.0001.rejection:0 "Non. [nu_assimilated_child.GetFirstName] ne peut pas simplement tourner le dos à nos coutumes."
 nu_assimilation.0001.mistrust:0 "Que lui a-t-on mis dans la tête loin de moi ?"
 nu_assimilation.0001.acceptance:0 "Quelles que soient ses coutumes, [nu_assimilated_child.GetFirstName] reste mon enfant."
 nu_assimilation.0001.reflection:0 "Je dois comprendre ce changement avant de le juger."
 nu_assimilation.0001.pragmatism:0 "Cette nouvelle identité pourrait encore lui être utile."
 nu_assimilation.0001.adaptation:0 "Les coutumes changent. La vie continue."
 nu_assimilation.0001.fallback:0 "Le temps me dira ce que je dois en penser."

 nu_assimilation.0002.rejection:0 "Je ne peux pas accepter que [nu_assimilated_child.GetFirstName] abandonne ainsi notre foi."
 nu_assimilation.0002.mistrust:0 "Qui l'a convaincu de tout cela loin de mes yeux ?"
 nu_assimilation.0002.acceptance:0 "Sa conscience lui appartient, et [nu_assimilated_child.GetFirstName] reste mon enfant."
 nu_assimilation.0002.reflection:0 "Une foi ne se juge pas dans l'emportement."
 nu_assimilation.0002.pragmatism:0 "Cette conversion pourrait aussi lui ouvrir des portes."
 nu_assimilation.0002.adaptation:0 "Les croyances changent avec les années."
 nu_assimilation.0002.fallback:0 "Il me faudra du temps pour comprendre ce changement."

 nu_assimilation.0003.rejection:0 "Tout devait donc disparaître, nos coutumes comme notre foi ?"
 nu_assimilation.0003.mistrust:0 "On a refaçonné [nu_assimilated_child.GetFirstName] loin de mes yeux."
 nu_assimilation.0003.acceptance:0 "Peu importe ce qui a changé, [nu_assimilated_child.GetFirstName] reste mon enfant."
 nu_assimilation.0003.reflection:0 "[nu_assimilated_child.GetFirstName] a changé. Je dois comprendre avant de juger."
 nu_assimilation.0003.pragmatism:0 "Une nouvelle identité peut parfois devenir un avantage."
 nu_assimilation.0003.adaptation:0 "Une vie peut prendre bien des chemins."
 nu_assimilation.0003.fallback:0 "Tant de choses ont changé..."

 # Notifications au tuteur
 NU_GUARDIAN_ASSIMILATION_CULTURE_TITLE:0 "Une nouvelle culture pour [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_CULTURE_DESC:0 "Votre pupille [nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName]. Au fil de son éducation, ces coutumes ont fini par devenir les siennes."

 NU_GUARDIAN_ASSIMILATION_RELIGION_TITLE:0 "Un nouveau rite pour [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_RELIGION_DESC:0 "Votre pupille [nu_assimilated_child.GetFirstName] suit désormais le rite [nu_assimilated_child.GetRite.GetName]. Ses convictions ont progressivement évolué au cours de son éducation."

 NU_GUARDIAN_ASSIMILATION_BOTH_TITLE:0 "Une nouvelle identité pour [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_BOTH_DESC:0 "Votre pupille [nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName] et suit le rite [nu_assimilated_child.GetRite.GetName]. Son éducation a profondément façonné son identité."
