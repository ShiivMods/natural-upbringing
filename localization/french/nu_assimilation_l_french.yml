l_french:

 nu_assimilation.0001.t:0 "Des nouvelles de [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0001.desc_rapid:0 "Une lettre de [nu_assimilated_child.GetFirstName] m'est parvenue. Ses lignes débordent d'un enthousiasme presque surprenant pour les usages et les coutumes découverts loin de chez nous. En si peu de temps, ce qui n'était encore qu'un monde étranger semble être devenu le sien.\n\nIl ne fait désormais guère de doute que [nu_assimilated_child.GetFirstName] se considère comme appartenant à la culture [nu_assimilated_child.GetCulture.GetName]."
 nu_assimilation.0001.desc:0 "Les nouvelles de [nu_assimilated_child.GetFirstName] confirment ce que les années laissaient déjà entrevoir. Les habitudes, la langue et les coutumes de son environnement ont progressivement pris racine.\n\n[nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName]."

 nu_assimilation.0002.t:0 "Le rite de [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0002.desc_rapid:0 "Une lettre de [nu_assimilated_child.GetFirstName] m'est parvenue, animée d'une ferveur nouvelle et inattendue. Quelques années à peine auront suffi pour que les croyances découvertes loin de chez nous cessent de lui être étrangères.\n\n[nu_assimilated_child.GetFirstName] suit désormais le rite [nu_religious_assimilation_target.GetName]."
 nu_assimilation.0002.desc:0 "Les lettres de [nu_assimilated_child.GetFirstName] avaient changé depuis quelque temps. Les références, les prières et les convictions qui s'y glissaient annonçaient peu à peu cette évolution.\n\n[nu_assimilated_child.GetFirstName] suit désormais le rite [nu_religious_assimilation_target.GetName]."

 nu_assimilation.0003.t:0 "Une nouvelle identité"
 nu_assimilation.0003.desc_rapid:0 "La dernière lettre de [nu_assimilated_child.GetFirstName] est presque méconnaissable tant l'enthousiasme qui l'habite est vif. En quelques années seulement, les coutumes comme les croyances de son nouvel environnement semblent avoir été pleinement embrassées.\n\n[nu_assimilated_child.GetFirstName] appartient désormais à la culture [nu_assimilated_child.GetCulture.GetName] et professe la foi [nu_religious_assimilation_target.GetName]."
 nu_assimilation.0003.desc:0 "Avec le temps, les nouvelles de [nu_assimilated_child.GetFirstName] avaient laissé deviner une transformation plus profonde qu'une simple adaptation à une cour étrangère. Ce changement est désormais manifeste.\n\n[nu_assimilated_child.GetFirstName] appartient à la culture [nu_assimilated_child.GetCulture.GetName] et professe la foi [nu_religious_assimilation_target.GetName]."

 nu_assimilation.0001.context_guardian_court_servants:0 "\n\nEt pourtant, même les serviteurs envoyés pour préserver nos usages n'auront pas suffi. Sous la tutelle de [nu_cultural_assimilation_guardian.GetFirstName], à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], cette nouvelle identité a fini par s'imposer."
 nu_assimilation.0001.context_guardian_court:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName], jointe à la vie passée à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], semble avoir profondément façonné [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_court:0 "\n\nLa vie à la cour de [nu_cultural_assimilation_court_owner.GetFirstName] semble avoir profondément façonné [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_guardian:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName] semble avoir joué un rôle déterminant dans cette évolution."

 nu_assimilation.0002.context_guardian_court_attendant:0 "\n\nMême l'accompagnement religieux prévu pour préserver sa foi n'aura pas suffi. Sous la tutelle de [nu_religious_assimilation_guardian.GetFirstName], à la cour de [nu_religious_assimilation_court_owner.GetFirstName], de nouvelles convictions ont fini par prendre racine."
 nu_assimilation.0002.context_guardian_court:0 "\n\nL'influence de [nu_religious_assimilation_guardian.GetFirstName] et la vie à la cour de [nu_religious_assimilation_court_owner.GetFirstName] semblent avoir nourri cette nouvelle foi."
 nu_assimilation.0002.context_court:0 "\n\nLa vie à la cour de [nu_religious_assimilation_court_owner.GetFirstName] semble avoir nourri peu à peu ces nouvelles convictions."
 nu_assimilation.0002.context_guardian:0 "\n\nL'influence de [nu_religious_assimilation_guardian.GetFirstName] semble avoir joué un rôle déterminant dans cette évolution spirituelle."

 nu_assimilation.0003.context_guardian_court:0 "\n\nSous la tutelle de [nu_cultural_assimilation_guardian.GetFirstName], à la cour de [nu_cultural_assimilation_court_owner.GetFirstName], [nu_assimilated_child.GetFirstName] semble avoir trouvé bien davantage qu'un simple lieu d'éducation."
 nu_assimilation.0003.context_court:0 "\n\nLa cour de [nu_cultural_assimilation_court_owner.GetFirstName] semble être devenue pour [nu_assimilated_child.GetFirstName] bien davantage qu'un simple lieu d'éducation."
 nu_assimilation.0003.context_guardian:0 "\n\nL'influence de [nu_cultural_assimilation_guardian.GetFirstName] semble avoir profondément marqué aussi bien les coutumes que les convictions de [nu_assimilated_child.GetFirstName]."


 nu_assimilation.0001.lustful:0 "Les coutumes changent, les désirs humains beaucoup moins."
 nu_assimilation.0001.chaste:0 "Les usages changent, mais la discipline d'une personne lui appartient."
 nu_assimilation.0001.gluttonous:0 "Au moins, j'espère qu'il n'a pas oublié les plats de chez nous."
 nu_assimilation.0001.temperate:0 "Ce changement ne mérite ni panique ni célébration."
 nu_assimilation.0001.greedy:0 "Si cette culture lui ouvre des portes, qu'il en tire profit."
 nu_assimilation.0001.generous:0 "Je peux lui accorder la liberté de devenir lui-même."
 nu_assimilation.0001.lazy:0 "Je ne vais pas lutter contre chaque nouvelle habitude."
 nu_assimilation.0001.diligent:0 "S'il a fait de ces coutumes les siennes, ce n'est probablement pas par hasard."
 nu_assimilation.0001.wrathful:0 "On lui a appris à oublier d'où il vient ?!"
 nu_assimilation.0001.calm:0 "Il n'y a aucune raison de perdre la tête pour cela."
 nu_assimilation.0001.patient:0 "Le temps dira ce que cette nouvelle identité signifie vraiment."
 nu_assimilation.0001.impatient:0 "Combien de changements encore devrai-je accepter ?"
 nu_assimilation.0001.arrogant:0 "J'espérais mieux que de le voir abandonner nos usages."
 nu_assimilation.0001.humble:0 "Qui suis-je pour prétendre que nos coutumes valent toujours mieux ?"
 nu_assimilation.0001.deceitful:0 "Il saura peut-être porter une identité ici et une autre ailleurs."
 nu_assimilation.0001.honest:0 "Si c'est vraiment ce qu'il est devenu, mieux vaut l'admettre."
 nu_assimilation.0001.craven:0 "J'espère que cela ne nous attirera pas d'ennuis."
 nu_assimilation.0001.brave:0 "Qu'il assume cette nouvelle identité sans honte."
 nu_assimilation.0001.shy:0 "Je ne sais même pas quoi lui dire à ce sujet."
 nu_assimilation.0001.gregarious:0 "Une autre culture n'en fait pas un étranger."
 nu_assimilation.0001.ambitious:0 "J'avais d'autres projets pour lui."
 nu_assimilation.0001.content:0 "Il est devenu différent. Cela ne signifie pas que tout est perdu."
 nu_assimilation.0001.arbitrary:0 "Cela me plaît aujourd'hui. Peut-être moins demain."
 nu_assimilation.0001.just:0 "Je dois juger ce qu'il est devenu, pas ce que j'espérais qu'il soit."
 nu_assimilation.0001.cynical:0 "Une culture n'est jamais aussi immuable qu'on aime le prétendre."
 nu_assimilation.0001.zealous:0 "La culture peut changer. Sa foi, elle, est une autre affaire."
 nu_assimilation.0001.paranoid:0 "Qui sait ce qu'on lui a mis dans la tête loin de mes yeux..."
 nu_assimilation.0001.trusting:0 "Je dois croire que cette identité est réellement devenue la sienne."
 nu_assimilation.0001.compassionate:0 "Quelles que soient ses coutumes, [nu_assimilated_child.GetFirstName] reste mon enfant."
 nu_assimilation.0001.callous:0 "C'est son choix. Qu'il vive avec."
 nu_assimilation.0001.sadistic:0 "S'il renie ses origines, il apprendra à vivre avec les conséquences."
 nu_assimilation.0001.stubborn:0 "On ne tourne pas si facilement le dos à ses origines."
 nu_assimilation.0001.fickle:0 "Les coutumes changent. Les liens demeurent."
 nu_assimilation.0001.vengeful:0 "Je n'oublierai pas ceux qui l'ont éloigné de nos coutumes."
 nu_assimilation.0001.forgiving:0 "Je ne lui en tiendrai pas rigueur."
 nu_assimilation.0001.eccentric:0 "Eh bien... voilà une tournure intéressante."
 nu_assimilation.0001.fallback:0 "Le temps me dira ce que je dois en penser."

 nu_assimilation.0002.lustful:0 "Les dieux ont toujours eu beaucoup à dire sur ce que nous désirons."
 nu_assimilation.0002.chaste:0 "J'espère au moins que sa nouvelle foi lui apprendra la discipline."
 nu_assimilation.0002.gluttonous:0 "Pourvu que ses nouveaux prêtres ne lui interdisent pas tout ce qui vaut la peine d'être mangé."
 nu_assimilation.0002.temperate:0 "La foi mérite réflexion, pas emportement."
 nu_assimilation.0002.greedy:0 "Si cette foi lui apporte des alliés, elle aura au moins une utilité."
 nu_assimilation.0002.generous:0 "La conscience d'un enfant ne m'appartient pas."
 nu_assimilation.0002.lazy:0 "Je n'ai aucune envie de débattre de théologie pendant des heures."
 nu_assimilation.0002.diligent:0 "Une conviction aussi profonde ne s'est sûrement pas construite en un jour."
 nu_assimilation.0002.wrathful:0 "Il a abandonné la foi dans laquelle nous l'avons élevé ?!"
 nu_assimilation.0002.calm:0 "Je peux entendre cela sans perdre mon calme."
 nu_assimilation.0002.patient:0 "Les croyances d'une vie ne se comprennent pas en une lettre."
 nu_assimilation.0002.impatient:0 "Encore une complication dont je me serais bien passé."
 nu_assimilation.0002.arrogant:0 "Il pense donc avoir trouvé une vérité meilleure que la nôtre."
 nu_assimilation.0002.humble:0 "Peut-être n'ai-je pas à décider de ce que son âme doit croire."
 nu_assimilation.0002.deceitful:0 "Une foi affichée n'est pas toujours une foi sincère."
 nu_assimilation.0002.honest:0 "S'il y croit vraiment, je préfère l'entendre clairement."
 nu_assimilation.0002.craven:0 "J'espère que cela ne nous mettra pas en danger."
 nu_assimilation.0002.brave:0 "Qu'il ait au moins le courage d'assumer sa foi."
 nu_assimilation.0002.shy:0 "Je préférerais ne pas avoir à en parler devant toute la cour."
 nu_assimilation.0002.gregarious:0 "Une autre foi ne suffit pas à faire de lui un étranger."
 nu_assimilation.0002.ambitious:0 "Cette conversion pourrait compliquer bien des projets."
 nu_assimilation.0002.content:0 "Ce n'est pas la foi que j'aurais choisie, mais ainsi soit-il."
 nu_assimilation.0002.arbitrary:0 "Aujourd'hui cela m'amuse presque. Demain, qui sait ?"
 nu_assimilation.0002.just:0 "Je dois distinguer ce qui me déplaît de ce qui est réellement injuste."
 nu_assimilation.0002.cynical:0 "Les dieux ont-ils seulement besoin de mon approbation ?"
 nu_assimilation.0002.zealous:0 "Il a abandonné la vraie foi."
 nu_assimilation.0002.paranoid:0 "Cette cour lui a certainement mis ces idées en tête."
 nu_assimilation.0002.trusting:0 "Je dois croire à la sincérité de sa conviction."
 nu_assimilation.0002.compassionate:0 "Sa foi ne changera pas ce qu'il est pour moi."
 nu_assimilation.0002.callous:0 "Qu'il prie qui il veut. Cela m'importe peu."
 nu_assimilation.0002.sadistic:0 "S'il rejette notre foi, il apprendra ce qu'il en coûte."
 nu_assimilation.0002.stubborn:0 "Je refuse d'accepter qu'il renie ainsi nos croyances."
 nu_assimilation.0002.fickle:0 "Les convictions changent avec les années."
 nu_assimilation.0002.vengeful:0 "Je n'oublierai pas ceux qui l'ont détourné de notre foi."
 nu_assimilation.0002.forgiving:0 "Je peux désapprouver sans lui en vouloir pour toujours."
 nu_assimilation.0002.eccentric:0 "Les dieux ont décidément un étrange sens de l'humour."
 nu_assimilation.0002.fallback:0 "Il me faudra du temps pour comprendre ce changement."

 nu_assimilation.0003.lustful:0 "Même avec une nouvelle foi et de nouvelles coutumes, il reste humain."
 nu_assimilation.0003.chaste:0 "Tout a changé autour de lui ; j'espère que sa discipline, elle, demeure."
 nu_assimilation.0003.gluttonous:0 "Culture, foi... j'espère au moins qu'ils savent cuisiner."
 nu_assimilation.0003.temperate:0 "Deux changements à la fois ne justifient pas de perdre toute mesure."
 nu_assimilation.0003.greedy:0 "S'il peut tirer quelque avantage de cette nouvelle identité, qu'il le fasse."
 nu_assimilation.0003.generous:0 "Je peux lui laisser la liberté d'être devenu quelqu'un d'autre."
 nu_assimilation.0003.lazy:0 "Je n'ai certainement pas l'énergie de combattre chaque aspect de ce changement."
 nu_assimilation.0003.diligent:0 "Un changement aussi complet n'a pas pu se faire sans des années d'efforts et d'influence."
 nu_assimilation.0003.wrathful:0 "Ils lui ont tout pris : nos coutumes et notre foi !"
 nu_assimilation.0003.calm:0 "Je refuse de laisser la colère parler à ma place."
 nu_assimilation.0003.patient:0 "Il me faudra du temps avant de comprendre tout ce que cela signifie."
 nu_assimilation.0003.impatient:0 "Tout devait donc changer d'un seul coup ?"
 nu_assimilation.0003.arrogant:0 "Je peine à croire qu'il ait préféré tout cela à ce que nous lui avons donné."
 nu_assimilation.0003.humble:0 "Peut-être que son chemin n'avait simplement pas à ressembler au mien."
 nu_assimilation.0003.deceitful:0 "Une nouvelle identité peut être portée de bien des façons."
 nu_assimilation.0003.honest:0 "Autant regarder la vérité en face : il n'est plus celui que j'avais envoyé."
 nu_assimilation.0003.craven:0 "Cela pourrait nous attirer des ennemis des deux côtés."
 nu_assimilation.0003.brave:0 "S'il a choisi cette voie, qu'il l'assume pleinement."
 nu_assimilation.0003.shy:0 "Je ne sais même pas comment commencer cette conversation."
 nu_assimilation.0003.gregarious:0 "[nu_assimilated_child.GetFirstName] est devenu différent, pas étranger."
 nu_assimilation.0003.ambitious:0 "Voilà qui bouleverse une bonne partie de mes projets."
 nu_assimilation.0003.content:0 "Tant qu'il trouve sa place, je peux vivre avec ce changement."
 nu_assimilation.0003.arbitrary:0 "Peut-être que cela me convient. Pour l'instant."
 nu_assimilation.0003.just:0 "Je dois le juger équitablement, même si tout cela me déplaît."
 nu_assimilation.0003.cynical:0 "La foi change, les coutumes aussi. Rien n'est immuable."
 nu_assimilation.0003.zealous:0 "Ils lui ont pris jusqu'à sa foi."
 nu_assimilation.0003.paranoid:0 "On l'a refaçonné loin de mes yeux."
 nu_assimilation.0003.trusting:0 "Je dois croire que cette nouvelle identité est sincèrement la sienne."
 nu_assimilation.0003.compassionate:0 "Peu importe ce qui a changé, [nu_assimilated_child.GetFirstName] reste mon enfant."
 nu_assimilation.0003.callous:0 "Alors qu'il vive avec ce qu'il est devenu."
 nu_assimilation.0003.sadistic:0 "S'il a choisi de nous renier, il apprendra ce que cela lui coûte."
 nu_assimilation.0003.stubborn:0 "Il ne peut pas simplement tourner le dos à tout ce que nous sommes."
 nu_assimilation.0003.fickle:0 "Une vie peut prendre bien des chemins."
 nu_assimilation.0003.vengeful:0 "Je me souviendrai de ceux qui ont façonné cette nouvelle identité."
 nu_assimilation.0003.forgiving:0 "Je peux déplorer ce changement sans en faire une rupture."
 nu_assimilation.0003.eccentric:0 "Eh bien... voilà une manière particulièrement complète de changer."
 nu_assimilation.0003.fallback:0 "Tant de choses ont changé..."
