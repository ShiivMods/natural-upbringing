l_french:
 nu_foreign_personality.0010.opening:0 "Des nouvelles de [nu_foreign_personality_child.GetFirstName]"

 nu_foreign_personality.0010.desc.lustful:0 "Lors d'une réception, [nu_foreign_personality_child.GetFirstName] a passé une bonne partie de la soirée à chercher la compagnie d'un jeune de son âge, trouvant prétexte après prétexte pour rester à proximité. [nu_foreign_personality_guardian.GetFirstName] a surtout retenu la rapidité avec laquelle son attention s'est transformée en véritable fascination.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.chaste:0 "Une conversation entre jeunes de la cour a récemment dérivé vers les premiers jeux d'attirance et les histoires de cœur. [nu_foreign_personality_child.GetFirstName] s'en est rapidement désintéressé[nu_foreign_personality_child.Custom('FR_E')], préférant quitter le groupe plutôt que participer à leurs plaisanteries. [nu_foreign_personality_guardian.GetFirstName] y voit une retenue devenue caractéristique.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gluttonous:0 "Les cuisines ont fini par remarquer que certaines portions disparaissaient après les repas. On a découvert [nu_foreign_personality_child.GetFirstName] venu[nu_foreign_personality_child.Custom('FR_E')] chercher les restes bien après que la table eut été débarrassée, sans paraître particulièrement gêné[nu_foreign_personality_child.Custom('FR_E')] d'être surpris[nu_foreign_personality_child.Custom('FR_E')].\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.temperate:0 "Lors d'un banquet où les autres jeunes se disputaient les meilleurs plats, [nu_foreign_personality_child.GetFirstName] s'est contenté[nu_foreign_personality_child.Custom('FR_E')] de sa part et a refusé qu'on lui en apporte davantage. [nu_foreign_personality_guardian.GetFirstName] fut frappé par cette modération volontaire.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.greedy:0 "Après avoir prêté quelques pièces à un camarade, [nu_foreign_personality_child.GetFirstName] a noté avec une précision étonnante la somme, la date et ce qui lui était encore dû. Plusieurs jours plus tard, votre enfant est revenu réclamer exactement ce qui manquait, sans avoir oublié le moindre détail.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.generous:0 "On a récemment retrouvé plusieurs possessions de [nu_foreign_personality_child.GetFirstName] entre les mains d'autres enfants et de serviteurs. Il ne s'agissait pas de vols : votre enfant les avait simplement distribuées à ceux qui les désiraient ou en avaient davantage besoin.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.lazy:0 "Chargé[nu_foreign_personality_child.Custom('FR_E')] d'une petite tâche avec d'autres jeunes, [nu_foreign_personality_child.GetFirstName] a passé davantage de temps à convaincre chacun de prendre une partie du travail qu'à travailler lui-même. À la fin, la tâche était accomplie et votre enfant presque reposé[nu_foreign_personality_child.Custom('FR_E')].\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.diligent:0 "Après avoir repéré une erreur minuscule dans un exercice pourtant déjà accepté, [nu_foreign_personality_child.GetFirstName] a insisté pour tout recommencer depuis le début. [nu_foreign_personality_guardian.GetFirstName] a fini par comprendre qu'un travail simplement suffisant ne satisfait plus votre enfant.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.wrathful:0 "Une moquerie lancée par un autre jeune aurait pu s'arrêter là. [nu_foreign_personality_child.GetFirstName] l'a prise comme une offense et la dispute a rapidement nécessité l'intervention d'un adulte. [nu_foreign_personality_guardian.GetFirstName] note que la colère vient désormais vite et fort.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.calm:0 "Une dispute particulièrement bruyante a éclaté juste à côté de [nu_foreign_personality_child.GetFirstName]. Tandis que les autres s'emportaient, votre enfant a attendu sans hausser la voix jusqu'à ce que chacun se calme suffisamment pour écouter. Cette maîtrise de soi n'est plus un hasard.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.patient:0 "Une cérémonie s'est prolongée pendant des heures bien au-delà de ce qui était prévu. Là où les autres jeunes se plaignaient ou cherchaient à partir, [nu_foreign_personality_child.GetFirstName] a attendu sans protester jusqu'à la toute fin. [nu_foreign_personality_guardian.GetFirstName] y voit une patience remarquable.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.impatient:0 "Pendant une longue explication, [nu_foreign_personality_child.GetFirstName] a fini par interrompre son interlocuteur pour lui demander d'en venir directement à la conclusion. Ce n'était pas la première fois que l'attente semblait lui peser davantage que la réponse elle-même.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arrogant:0 "Lors d'un exercice de groupe, [nu_foreign_personality_child.GetFirstName] a refusé de suivre les instructions d'un autre jeune qu'[nu_foreign_personality_child.Custom('FR_IlElle')] jugeait moins compétent. Même lorsqu'on lui rappela qu'il avait été choisi pour diriger, votre enfant resta convaincu[nu_foreign_personality_child.Custom('FR_E')] de savoir mieux que lui.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.humble:0 "Après avoir reçu des éloges pour un travail réussi, [nu_foreign_personality_child.GetFirstName] s'est empressé[nu_foreign_personality_child.Custom('FR_E')] de rappeler l'aide reçue et de détourner les compliments vers les autres. [nu_foreign_personality_guardian.GetFirstName] remarque que votre enfant recherche rarement le mérite pour lui-même.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.deceitful:0 "Après qu'un objet eut été endommagé, [nu_foreign_personality_child.GetFirstName] a construit une explication si précise qu'un autre enfant a d'abord semblé responsable. Quelques détails soigneusement placés ont suffi à convaincre presque tout le monde avant que la vérité n'apparaisse.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.honest:0 "Un objet de la cour a récemment été abîmé sans témoin. Avant même que quiconque ne commence à chercher un responsable, [nu_foreign_personality_child.GetFirstName] est venu[nu_foreign_personality_child.Custom('FR_E')] reconnaître spontanément sa faute, malgré la punition certaine qui l'attendait.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.craven:0 "Lors d'une sortie, un cheval s'est brusquement cabré à proximité. [nu_foreign_personality_child.GetFirstName] s'est immédiatement mis[nu_foreign_personality_child.Custom('FR_E')] à l'abri et a refusé d'approcher de nouveau l'animal longtemps après que tout danger eut disparu. [nu_foreign_personality_guardian.GetFirstName] a pris note de cette peur tenace.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.brave:0 "Lors d'une sortie, un cheval s'est brusquement cabré et a semé la panique parmi les jeunes présents. Tandis que plusieurs reculaient, [nu_foreign_personality_child.GetFirstName] s'est avancé[nu_foreign_personality_child.Custom('FR_E')] pour aider à reprendre le contrôle de l'animal. Le geste était risqué, mais personne ne peut nier le courage qu'il a demandé.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.shy:0 "À l'annonce de visiteurs venus rencontrer les jeunes de la cour, [nu_foreign_personality_child.GetFirstName] a disparu avant même leur arrivée. On l'a finalement retrouvé[nu_foreign_personality_child.Custom('FR_E')] dans un endroit calme, préférant manifestement éviter toute présentation.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gregarious:0 "Au cours d'une réception, [nu_foreign_personality_child.GetFirstName] semblait connaître quelqu'un dans chaque groupe. Votre enfant passait d'une conversation à l'autre avec une facilité telle que [nu_foreign_personality_guardian.GetFirstName] a fini par remarquer combien la compagnie des autres lui est devenue naturelle.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.ambitious:0 "Après une leçon consacrée aux meilleurs élèves de la cour, [nu_foreign_personality_child.GetFirstName] n'a pas demandé comment les égaler, mais comment les dépasser. Depuis, [nu_foreign_personality_guardian.GetFirstName] remarque la même question derrière beaucoup de ses efforts.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.content:0 "Une comparaison entre les possessions de plusieurs jeunes a laissé [nu_foreign_personality_child.GetFirstName] presque indifférent[nu_foreign_personality_child.Custom('FR_E')]. Là où d'autres enviaient ce qu'ils n'avaient pas, votre enfant s'est simplement déclaré[nu_foreign_personality_child.Custom('FR_E')] satisfait[nu_foreign_personality_child.Custom('FR_E')] de ce qui lui appartenait déjà.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arbitrary:0 "Deux jeunes sont récemment venus demander à [nu_foreign_personality_child.GetFirstName] de trancher deux disputes presque identiques. Votre enfant a rendu des décisions totalement différentes, puis s'est montré[nu_foreign_personality_child.Custom('FR_E')] incapable de voir pourquoi cela surprenait tout le monde.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.just:0 "Lorsqu'un camarade a été puni pour une faute qu'il n'avait manifestement pas commise, [nu_foreign_personality_child.GetFirstName] a insisté jusqu'à ce que l'affaire soit réexaminée. La décision ne le concernait pas, mais son injustice lui semblait impossible à ignorer.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.cynical:0 "Au cours d'une leçon, [nu_foreign_personality_child.GetFirstName] a demandé pourquoi une autorité devait être crue simplement parce qu'elle affirmait détenir la vérité. La discussion s'est prolongée bien au-delà du sujet prévu et [nu_foreign_personality_guardian.GetFirstName] doute désormais que votre enfant accepte facilement une affirmation sans l'examiner.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.zealous:0 "Pendant une cérémonie, [nu_foreign_personality_child.GetFirstName] a remarqué une erreur dans l'accomplissement d'un rite et l'a signalée avant que quiconque n'ose passer outre. [nu_foreign_personality_guardian.GetFirstName] estime que la foi est devenue pour votre enfant une affaire trop importante pour être traitée avec légèreté.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.paranoid:0 "Une conversation s'est brusquement interrompue lorsque [nu_foreign_personality_child.GetFirstName] est entré[nu_foreign_personality_child.Custom('FR_E')] dans une pièce. Plutôt que l'oublier, votre enfant a passé les jours suivants à chercher qui parlait, de quoi et pourquoi on s'était tu en sa présence.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.trusting:0 "[nu_foreign_personality_child.GetFirstName] a récemment confié un objet auquel [nu_foreign_personality_child.Custom('FR_IlElle')] tenait beaucoup à un autre jeune sur la seule promesse qu'il lui serait rendu. [nu_foreign_personality_guardian.GetFirstName] fut presque plus surpris par l'absence totale de méfiance que par le geste lui-même.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.compassionate:0 "Alors qu'une tâche importante devait être terminée, [nu_foreign_personality_child.GetFirstName] l'a abandonnée sans hésiter pour rester auprès d'un camarade blessé. La réprimande attendrait, expliqua votre enfant, quelqu'un avait besoin d'aide maintenant.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.callous:0 "Un jeune de la cour s'est blessé pendant un exercice et plusieurs personnes se sont précipitées pour l'aider. [nu_foreign_personality_child.GetFirstName] a vérifié qu'il était pris en charge, puis a simplement repris sa propre tâche comme si l'incident ne concernait déjà plus personne.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.sadistic:0 "Un jeu où un enfant devait subir une humiliation légère aurait dû s'arrêter rapidement. [nu_foreign_personality_child.GetFirstName] a pourtant cherché à le prolonger bien après que les autres eurent perdu leur enthousiasme, manifestement amusé[nu_foreign_personality_child.Custom('FR_E')] par le malaise de la victime.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.stubborn:0 "Même après qu'on lui eut démontré clairement une erreur dans son exercice, [nu_foreign_personality_child.GetFirstName] a refusé d'en modifier la conclusion. Plus on insistait, plus votre enfant défendait sa position avec détermination.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fickle:0 "Pendant plusieurs jours, [nu_foreign_personality_child.GetFirstName] ne parlait que d'une nouvelle passion et jurait vouloir tout apprendre à son sujet. Le lendemain, elle avait déjà été remplacée par une autre, défendue avec exactement la même ferveur.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.eccentric:0 "Face à un exercice que tous tentaient de résoudre de la même manière, [nu_foreign_personality_child.GetFirstName] a proposé une méthode si étrange que [nu_foreign_personality_guardian.GetFirstName] a d'abord cru à une plaisanterie. Pourtant, la solution fonctionnait parfaitement. Ce genre de détour devient une habitude.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.vengeful:0 "Plusieurs semaines après une offense que tout le monde semblait avoir oubliée, [nu_foreign_personality_child.GetFirstName] a attendu l'occasion exacte de rendre à son auteur une humiliation presque équivalente. Votre enfant n'avait rien oublié, seulement patienté.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.forgiving:0 "Après une dispute sérieuse, plusieurs camarades s'attendaient à voir [nu_foreign_personality_child.GetFirstName] chercher à rendre l'affront. Votre enfant a au contraire refusé toute revanche et, quelques jours plus tard, reparlait déjà normalement avec l'autre jeune.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"

 nu_foreign_personality.0010.desc.fallback:0 "Un incident récent a convaincu [nu_foreign_personality_guardian.GetFirstName] qu'un aspect jusque-là discret du caractère de [nu_foreign_personality_child.GetFirstName] est désormais devenu durable.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"

 nu_foreign_personality.0010.recognition:0 "Je reconnais bien là un tempérament que je comprends."
 nu_foreign_personality.0010.opposition:0 "Voilà un caractère qui me sera difficile à comprendre."
 nu_foreign_personality.0010.rejection:0 "Il faudra veiller à ce que ce trait ne prenne pas trop de place."
 nu_foreign_personality.0010.mistrust:0 "Je me demande ce qui, là-bas, a encouragé cette évolution."
 nu_foreign_personality.0010.acceptance:0 "C'est à [nu_foreign_personality_child.GetFirstName] de devenir la personne qu'[nu_foreign_personality_child.Custom('FR_IlElle')] doit être."
 nu_foreign_personality.0010.reflection:0 "Un trait ne résume pas une personne, mais il en dit déjà beaucoup."
 nu_foreign_personality.0010.pragmatism:0 "Selon les circonstances, ce caractère pourra aussi devenir un avantage."
 nu_foreign_personality.0010.adaptation:0 "Les enfants changent en grandissant. Celui-ci trouvera sa place."
 nu_foreign_personality.0010.fallback:0 "Je garderai cette nouvelle en mémoire."
