l_french:
 nu_foreign_personality.0010.opening:0 "Des nouvelles de [nu_foreign_personality_child.GetFirstName]"
 nu_foreign_personality.0010.desc.lustful:0 "[nu_foreign_personality_child.GetFirstName] montre depuis quelque temps une sensibilité très vive aux personnes qui l'entourent. Les attachements se forment vite, les regards et les compliments semblent compter plus qu'auparavant, et cette intensité émotionnelle devient difficile à ignorer.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.chaste:0 "[nu_foreign_personality_child.GetFirstName] paraît au contraire rechercher une certaine retenue dans ses affections. [nu_foreign_personality_child.Custom('FR_IlElle')|U] se montre réservé[nu_foreign_personality_child.Custom('FR_E')] face aux jeux de séduction et préfère garder une distance que d'autres jeunes de son âge ne comprennent pas toujours.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gluttonous:0 "À table comme lors des festivités, [nu_foreign_personality_child.GetFirstName] a de plus en plus de mal à résister à ce qui lui fait envie. Les cuisines connaissent déjà son passage, et la modération semble être une leçon qu'il faudra encore longtemps répéter.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.temperate:0 "[nu_foreign_personality_child.GetFirstName] fait preuve d'une remarquable mesure. Là où d'autres se laissent facilement emporter par leurs envies, [nu_foreign_personality_child.Custom('FR_IlElle')] sait s'arrêter, attendre et se contenter de ce qui lui est nécessaire.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.greedy:0 "[nu_foreign_personality_child.GetFirstName] accorde une attention croissante à ce qui lui appartient. Pièces, cadeaux ou simples objets, rien ne lui échappe, et [nu_foreign_personality_child.Custom('FR_IlElle')] accepte difficilement de se séparer de ce qu'[nu_foreign_personality_child.Custom('FR_IlElle')] considère comme sien.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.generous:0 "[nu_foreign_personality_child.GetFirstName] partage volontiers ce qu'[nu_foreign_personality_child.Custom('FR_IlElle')] possède, parfois même davantage que nous ne le souhaiterions. Serviteurs, camarades et nécessiteux savent déjà qu'il suffit rarement de demander deux fois.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.lazy:0 "Les leçons de [nu_foreign_personality_child.GetFirstName] avancent, mais rarement avec empressement. [nu_foreign_personality_child.Custom('FR_IlElle')|U] excelle surtout dans l'art de remettre une tâche au lendemain ou de trouver quelqu'un d'autre pour s'en charger.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.diligent:0 "Il devient difficile de convaincre [nu_foreign_personality_child.GetFirstName] de délaisser une tâche avant qu'elle ne soit terminée. Leçons, exercices ou devoirs, [nu_foreign_personality_child.Custom('FR_IlElle')] s'y applique avec une constance inhabituelle pour son âge.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.wrathful:0 "Le tempérament de [nu_foreign_personality_child.GetFirstName] s'est nettement durci. Une contrariété suffit parfois à déclencher une colère vive, et [nu_foreign_personality_child.Custom('FR_IlElle')] pardonne difficilement ce qu'[nu_foreign_personality_child.Custom('FR_IlElle')] considère comme une offense.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.calm:0 "Même lorsque la cour s'agite autour de [nu_foreign_personality_child.GetFirstName], [nu_foreign_personality_child.Custom('FR_IlElle')] conserve une étonnante maîtrise de soi. Les disputes et provocations semblent rarement parvenir à lui faire perdre son calme.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.patient:0 "[nu_foreign_personality_child.GetFirstName] a appris à attendre. Les longues leçons, les discussions interminables et même les contrariétés sont supportées avec une patience qui surprend régulièrement ceux qui l'entourent.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.impatient:0 "Attendre est devenu un véritable supplice pour [nu_foreign_personality_child.GetFirstName]. [nu_foreign_personality_child.Custom('FR_IlElle')|U] veut comprendre, agir ou obtenir immédiatement, et supporte de moins en moins que le monde avance plus lentement que ses propres envies.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arrogant:0 "[nu_foreign_personality_child.GetFirstName] semble avoir pris pleinement conscience de son rang et de ses qualités. Peut-être même un peu trop. [nu_foreign_personality_child.Custom('FR_IlElle')|U] parle désormais avec l'assurance de quelqu'un qui doute rarement d'avoir raison.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.humble:0 "Malgré les égards dus à sa naissance, [nu_foreign_personality_child.GetFirstName] cherche rarement à se placer au-dessus des autres. [nu_foreign_personality_child.Custom('FR_IlElle')|U] accepte les conseils, reconnaît ses erreurs et paraît peu intéressé[nu_foreign_personality_child.Custom('FR_E')] par les flatteries.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.deceitful:0 "Nous avons découvert que [nu_foreign_personality_child.GetFirstName] savait dissimuler bien davantage qu'on ne le supposait. Une excuse convaincante, une vérité soigneusement incomplète, parfois un mensonge entier, [nu_foreign_personality_child.Custom('FR_IlElle')] apprend vite à contrôler ce que les autres croient savoir.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.honest:0 "[nu_foreign_personality_child.GetFirstName] semble incapable de laisser longtemps une tromperie sans l'avouer. Même lorsque la vérité lui coûte, [nu_foreign_personality_child.Custom('FR_IlElle')] préfère généralement dire ce qui s'est réellement passé.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.craven:0 "Face au danger, même modeste, [nu_foreign_personality_child.GetFirstName] cherche désormais d'abord la sécurité. [nu_foreign_personality_child.Custom('FR_IlElle')|U] évite les affrontements et paraît toujours imaginer ce qui pourrait mal tourner.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.brave:0 "[nu_foreign_personality_child.GetFirstName] montre une assurance croissante face au danger. Là où d'autres hésitent, [nu_foreign_personality_child.Custom('FR_IlElle')] avance souvent le premier, parfois avec un courage qui frôle l'imprudence.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.shy:0 "[nu_foreign_personality_child.GetFirstName] s'efface de plus en plus dans les grandes réunions. Les inconnus et l'attention de la cour semblent peser sur [nu_foreign_personality_child.Custom('FR_LuiElle')], qui préfère quelques visages familiers aux salles pleines de monde.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gregarious:0 "La cour entière semble connaître [nu_foreign_personality_child.GetFirstName]. [nu_foreign_personality_child.Custom('FR_IlElle')|U] recherche constamment la compagnie des autres, engage facilement la conversation et supporte manifestement mal d'être isolé[nu_foreign_personality_child.Custom('FR_E')].\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.ambitious:0 "Les aspirations de [nu_foreign_personality_child.GetFirstName] deviennent difficiles à ignorer. Réussir ne lui suffit plus toujours, [nu_foreign_personality_child.Custom('FR_IlElle')] veut être remarqué[nu_foreign_personality_child.Custom('FR_E')], progresser et dépasser ceux qui l'entourent.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.content:0 "[nu_foreign_personality_child.GetFirstName] semble étonnamment satisfait[nu_foreign_personality_child.Custom('FR_E')] de sa place actuelle. [nu_foreign_personality_child.Custom('FR_IlElle')|U] réclame peu, envie rarement les autres et paraît apprécier ce qu'[nu_foreign_personality_child.Custom('FR_IlElle')] possède déjà.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arbitrary:0 "Les décisions de [nu_foreign_personality_child.GetFirstName] deviennent parfois difficiles à prévoir. Deux situations presque identiques peuvent recevoir des réponses totalement différentes selon son humeur du moment.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.just:0 "[nu_foreign_personality_child.GetFirstName] accorde une importance croissante aux règles et à l'équité. Même lorsqu'une décision lui serait avantageuse, [nu_foreign_personality_child.Custom('FR_IlElle')] supporte mal qu'elle lui paraisse injuste.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.cynical:0 "[nu_foreign_personality_child.GetFirstName] accepte de moins en moins les explications simplement parce qu'un adulte ou un religieux les affirme. [nu_foreign_personality_child.Custom('FR_IlElle')|U] questionne les intentions, les croyances et les belles paroles avec une méfiance croissante.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.zealous:0 "La foi occupe désormais une place importante dans l'esprit de [nu_foreign_personality_child.GetFirstName]. Prières, enseignements et questions religieuses sont prises avec un sérieux croissant, parfois avec une ferveur qui surprend même ceux chargés de son instruction.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.paranoid:0 "[nu_foreign_personality_child.GetFirstName] semble chercher une intention cachée derrière de nombreux gestes. Une porte fermée, une conversation interrompue ou un regard échangé suffisent parfois à éveiller ses soupçons.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.trusting:0 "[nu_foreign_personality_child.GetFirstName] accorde facilement sa confiance à ceux qui l'entourent. [nu_foreign_personality_child.Custom('FR_IlElle')|U] suppose volontiers la bonne foi des autres, parfois même lorsque davantage de prudence serait souhaitable.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.compassionate:0 "La souffrance des autres touche profondément [nu_foreign_personality_child.GetFirstName]. [nu_foreign_personality_child.Custom('FR_IlElle')|U] intervient volontiers pour consoler, défendre ou aider, même lorsque personne ne lui demande de le faire.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.callous:0 "[nu_foreign_personality_child.GetFirstName] paraît de moins en moins affecté[nu_foreign_personality_child.Custom('FR_E')] par les malheurs des autres. [nu_foreign_personality_child.Custom('FR_IlElle')|U] comprend ce qu'ils ressentent, mais semble rarement considérer leurs émotions comme une raison suffisante pour changer de conduite.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.sadistic:0 "Certains comportements de [nu_foreign_personality_child.GetFirstName] commencent à nous inquiéter. [nu_foreign_personality_child.Custom('FR_IlElle')|U] ne se contente pas toujours de voir un adversaire perdre, il lui arrive de prendre un plaisir manifeste à prolonger son humiliation ou sa souffrance.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.stubborn:0 "Une fois que [nu_foreign_personality_child.GetFirstName] a pris une décision, il devient extrêmement difficile de l'en détourner. Conseils, arguments et parfois même sanctions ne font souvent que renforcer sa détermination.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fickle:0 "Les enthousiasmes de [nu_foreign_personality_child.GetFirstName] changent rapidement. Ce qui semblait essentiel hier peut être oublié demain, remplacé par une nouvelle idée défendue avec exactement la même conviction.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.eccentric:0 "[nu_foreign_personality_child.GetFirstName] développe des habitudes et des raisonnements qui lui appartiennent entièrement. Certaines de ses idées paraissent brillantes, d'autres incompréhensibles, mais elles suivent presque toujours une logique que [nu_foreign_personality_child.Custom('FR_IlElle')] semble être seul[nu_foreign_personality_child.Custom('FR_E')] à saisir.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.vengeful:0 "[nu_foreign_personality_child.GetFirstName] oublie difficilement une offense. Même plusieurs semaines plus tard, [nu_foreign_personality_child.Custom('FR_IlElle')] peut encore parfaitement expliquer qui lui a fait du tort et pourquoi cette dette n'est, à ses yeux, toujours pas réglée.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.forgiving:0 "Les rancunes semblent avoir peu de prise sur [nu_foreign_personality_child.GetFirstName]. Même après une dispute sérieuse, [nu_foreign_personality_child.Custom('FR_IlElle')] préfère généralement tourner la page plutôt que chercher à rendre le mal reçu.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fallback:0 "Le caractère de [nu_foreign_personality_child.GetFirstName] semble avoir durablement évolué au cours de son séjour. Ce qui paraissait encore passager il y a quelque temps est désormais devenu une part évidente de sa personnalité.\n\n#bold Trait acquis :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.a:0 "Ainsi se forge son caractère."
