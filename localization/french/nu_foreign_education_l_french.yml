l_french:
 nu_foreign_education.0001.opening:0 "Des nouvelles de [nu_foreign_education_child.GetFirstName]"
 nu_foreign_education.0001.desc.integrated:0 "Je souhaitais vous donner des nouvelles de [nu_foreign_education_child.GetFirstName]. [nu_foreign_education_child.Custom('FR_IlElle')|U] paraît désormais très à l'aise parmi nous. Nos usages ne lui sont plus étrangers, et il arrive même que je doive me rappeler depuis combien de temps seulement [nu_foreign_education_child.Custom('FR_IlElle')] vit à notre cour."
 nu_foreign_education.0001.desc.social:0 "[nu_foreign_education_child.GetFirstName] s'est rapidement fait une place à la cour. [nu_foreign_education_child.Custom('FR_IlElle')|U] converse volontiers avec ceux qui l'entourent, se mêle aux autres enfants et semble découvrir chaque jour quelque chose de nouveau avec enthousiasme."
 nu_foreign_education.0001.desc.reserved:0 "[nu_foreign_education_child.GetFirstName] reste encore en retrait. [nu_foreign_education_child.Custom('FR_IlElle')|U] observe beaucoup, parle peu, et semble avoir besoin de temps avant d'accorder sa confiance. Rien d'alarmant, mais son adaptation se fait avec prudence."
 nu_foreign_education.0001.desc.difficult:0 "[nu_foreign_education_child.GetFirstName] ne manque certainement pas de caractère. [nu_foreign_education_child.Custom('FR_IlElle')|U] conteste volontiers ce qui lui paraît étrange et défend avec vigueur les habitudes qu'on lui a enseignées chez vous. Son éducation progresse, non sans quelques discussions animées."
 nu_foreign_education.0001.desc.fallback:0 "Je souhaitais vous rassurer au sujet de [nu_foreign_education_child.GetFirstName]. Son installation se poursuit normalement. Tout ici lui est encore un peu nouveau, mais chaque semaine rend la cour plus familière."
 nu_foreign_education.0001.a:0 "Je prends bonne note de ces nouvelles."

 nu_foreign_education.0010.opening:0 "Une amitié inattendue"
 nu_foreign_education.0010.desc.reserved:0 "Une chose assez inattendue s'est produite. Malgré sa réserve habituelle, [nu_foreign_education_child.GetFirstName] s'est rapproché[nu_foreign_education_child.Custom('FR_E')] de [nu_foreign_education_peer.GetFirstName]. On les voit désormais souvent ensemble, parfois simplement assis à l'écart du reste de la cour."
 nu_foreign_education.0010.desc.social:0 "[nu_foreign_education_child.GetFirstName] et [nu_foreign_education_peer.GetFirstName] sont devenus presque inséparables. Jeux, repas, leçons, ils trouvent toujours une raison de se retrouver. Cette amitié semble avoir beaucoup facilité l'intégration de votre enfant."
 nu_foreign_education.0010.desc.fallback:0 "Je tenais à vous informer que [nu_foreign_education_child.GetFirstName] s'est lié[nu_foreign_education_child.Custom('FR_E')] d'amitié avec [nu_foreign_education_peer.GetFirstName]. Leur complicité s'est installée naturellement au fil des semaines."
 nu_foreign_education.0010.a:0 "Voilà une nouvelle qui me rassure."

 nu_foreign_education.0020.opening:0 "L'étranger de la cour"
 nu_foreign_education.0020.desc.withdrawn:0 "Quelques enfants de la cour se sont récemment moqués de l'accent et des habitudes de [nu_foreign_education_child.GetFirstName]. [nu_foreign_education_child.Custom('FR_IlElle')|U] n'a pas répondu, mais s'est isolé[nu_foreign_education_child.Custom('FR_E')] durant le reste de la journée. L'incident semble l'avoir davantage touché[nu_foreign_education_child.Custom('FR_E')] qu'[nu_foreign_education_child.Custom('FR_IlElle')] ne veut bien l'admettre."
 nu_foreign_education.0020.desc.defiant:0 "Certains enfants de la cour ont cru amusant de railler les coutumes de [nu_foreign_education_child.GetFirstName]. Ils ont vite découvert que votre enfant n'avait aucune intention de les laisser parler sans répondre. La discussion fut vive, mais le message semble avoir été compris."
 nu_foreign_education.0020.desc.adapting:0 "Quelques plaisanteries ont été faites au sujet des habitudes étrangères de [nu_foreign_education_child.GetFirstName]. À ma surprise, [nu_foreign_education_child.Custom('FR_IlElle')] les a prises avec légèreté et a même retourné la plaisanterie. Depuis, [nu_foreign_education_child.Custom('FR_IlElle')] semble un peu moins être considéré[nu_foreign_education_child.Custom('FR_E')] comme l'étranger de la cour."
 nu_foreign_education.0020.desc.fallback:0 "Les différences de coutumes ont fini par attirer quelques remarques à l'encontre de [nu_foreign_education_child.GetFirstName]. Rien de sérieux n'en est sorti, mais c'est la première fois que votre enfant semble avoir réellement pris conscience d'être ici l'étranger."
 nu_foreign_education.0020.a:0 "J'espère que cette expérience lui servira."

 nu_foreign_education.0030.opening:0 "Une coutume étrange"
 nu_foreign_education.0030.desc.resistant:0 "À l'occasion d'une cérémonie locale, [nu_foreign_education_child.GetFirstName] a été invité[nu_foreign_education_child.Custom('FR_E')] à prendre part à une tradition de notre cour. [nu_foreign_education_child.Custom('FR_IlElle')|U] a accepté d'y assister, mais n'a guère caché son scepticisme et a tenu à rappeler que l'on faisait les choses autrement chez vous."
 nu_foreign_education.0030.desc.curious:0 "[nu_foreign_education_child.GetFirstName] a récemment assisté à l'une de nos traditions locales. Là où d'autres se seraient contentés d'observer, votre enfant a multiplié les questions, cherchant à comprendre l'origine de chaque geste et la raison de chaque usage."
 nu_foreign_education.0030.desc.enthusiastic:0 "Nous avons récemment convié [nu_foreign_education_child.GetFirstName] à participer à l'une de nos traditions locales. [nu_foreign_education_child.Custom('FR_IlElle')|U] s'y est prêté[nu_foreign_education_child.Custom('FR_E')] avec tant d'enthousiasme que plusieurs courtisans en ont oublié qu'il s'agissait pour [nu_foreign_education_child.Custom('FR_LuiElle')] d'une première fois."
 nu_foreign_education.0030.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] a récemment participé à l'une des traditions de notre cour. [nu_foreign_education_child.Custom('FR_IlElle')|U] a fait preuve d'attention et de respect, même si certaines de nos habitudes lui paraissent encore bien étranges."
 nu_foreign_education.0030.a:0 "Ainsi découvre-t-on un autre monde."

 nu_foreign_education.0040.opening:0 "Une lettre de [nu_foreign_education_child.GetFirstName]"
 nu_foreign_education.0040.desc.language:0 "« Je vais bien. Les leçons continuent et je commence à comprendre bien mieux les gens d'ici. Je vous raconterai tout cela lorsque nous nous reverrons. »

La lettre est banale en apparence. Pourtant, certaines tournures et quelques expressions employées par [nu_foreign_education_child.GetFirstName] ne sont pas celles que vous lui connaissiez. La langue et les habitudes de sa nouvelle cour commencent manifestement à déteindre sur sa façon de penser."
 nu_foreign_education.0040.desc.fallback:0 "« Je vais bien. Les journées sont toujours très occupées ici. Je vous écrirai encore bientôt. »

Rien d'inquiétant dans ces quelques lignes, mais quelque chose a changé. [nu_foreign_education_child.GetFirstName] emploie désormais des références et des manières de parler qui semblent venir tout droit de sa nouvelle cour."
 nu_foreign_education.0040.a:0 "Même ses mots commencent à changer..."

 nu_foreign_education.0050.opening:0 "Entre deux mondes"
 nu_foreign_education.0050.desc.servants:0 "Je remarque depuis quelque temps quelque chose d'intéressant chez [nu_foreign_education_child.GetFirstName]. Les gens que vous avez envoyés avec [nu_foreign_education_child.Custom('FR_LuiElle')] ont préservé de nombreuses habitudes de votre foyer, tandis que notre cour lui en a enseigné de nouvelles. Votre enfant passe désormais de l'une à l'autre avec une étonnante facilité."
 nu_foreign_education.0050.desc.deep:0 "[nu_foreign_education_child.GetFirstName] semble vivre entre deux mondes. Certaines de ses manières viennent encore clairement de chez vous, mais d'autres sont désormais si naturelles qu'on les croirait apprises depuis l'enfance. Il devient parfois difficile de dire où finit l'un de ses héritages et où commence l'autre."
 nu_foreign_education.0050.desc.fallback:0 "Les habitudes de [nu_foreign_education_child.GetFirstName] deviennent difficiles à définir. [nu_foreign_education_child.Custom('FR_IlElle')|U] conserve certaines coutumes de son foyer d'origine, tout en adoptant spontanément celles de notre cour. Ce mélange ne semble plus lui paraître contradictoire."
 nu_foreign_education.0050.a:0 "Deux mondes peuvent donc cohabiter."

 nu_foreign_education_cultural_acceptance_desc:0 "Éducation d'un enfant entre deux cultures"

 nu_foreign_education.0070.opening:0 "Un sentiment inattendu"
 nu_foreign_education.0070.desc.new:0 "Je pensais qu'il ne s'agissait au départ que d'une nouvelle connaissance de la cour, mais [nu_foreign_education_child.GetFirstName] porte manifestement une attention particulière à [nu_foreign_education_peer.GetFirstName]. Les regards insistants et les prétextes pour rester à proximité sont devenus difficiles à ignorer."
 nu_foreign_education.0070.desc.friend:0 "L'amitié entre [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_peer.GetFirstName] semble avoir pris une tournure nouvelle. Leur complicité est toujours là, mais [nu_foreign_education_child.GetFirstName] ne regarde manifestement plus [nu_foreign_education_peer.GetFirstName] comme un simple ami."
 nu_foreign_education.0070.desc.rival:0 "La rivalité entre [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_peer.GetFirstName] devient de plus en plus difficile à définir. Les provocations n'ont pas cessé, mais quelque chose d'autre semble désormais se mêler à leur étrange fascination mutuelle."
 nu_foreign_education.0070.a:0 "Voilà qui mérite d'être gardé à l'esprit."

 nu_foreign_education.0080.opening:0 "Le Rival"
 nu_foreign_education.0080.desc.unchanged:0 "La rivalité entre [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_rival.GetFirstName] ne montre aucun signe d'apaisement. Chacun semble désormais connaître exactement les manières d'irriter l'autre, et ni l'un ni l'autre ne paraît disposé à céder."
 nu_foreign_education.0080.desc.friend:0 "Après tant de disputes, [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_rival.GetFirstName] ont fini par trouver un terrain d'entente. Leur ancienne rivalité semble s'être transformée en une véritable amitié, née peut-être précisément du respect qu'ils ont appris à se porter."
 nu_foreign_education.0080.desc.nemesis:0 "Les tensions entre [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_rival.GetFirstName] ont franchi un nouveau seuil. Ce qui ressemblait encore à une rivalité d'enfants est devenu une hostilité profonde que ni les leçons ni les remontrances ne semblent pouvoir calmer."
 nu_foreign_education.0080.desc.crush:0 "La rivalité entre [nu_foreign_education_child.GetFirstName] et [nu_foreign_education_rival.GetFirstName] demeure, mais leur attention l'un envers l'autre paraît désormais bien plus compliquée qu'une simple hostilité."
 nu_foreign_education.0080.a:0 "Les enfants trouvent parfois d'étranges chemins."

 nu_foreign_education_integrated_opinion:0 "Très bien intégré à la cour"
 nu_foreign_education_social_opinion:0 "Bonne adaptation à la cour"
 nu_foreign_education_difficult_opinion:0 "Adaptation difficile à la cour"
 nu_foreign_education_parent_support_opinion:0 "Soutien pendant son éducation"
 nu_foreign_education_parent_rejection_opinion:0 "Déçu par la réaction de son parent"

 # Réactions parentales aux nouvelles générales
 nu_foreign_education.0001.rejection:0 "Quoi qu'il arrive là-bas, [nu_foreign_education_child.GetFirstName] ne doit pas oublier d'où [nu_foreign_education_child.Custom('FR_IlElle')] vient."
 nu_foreign_education.0001.mistrust:0 "Cette cour exerce manifestement une forte influence. Je garderai cela à l'esprit."
 nu_foreign_education.0001.acceptance:0 "L'essentiel est que [nu_foreign_education_child.GetFirstName] trouve sa place sans être malheureu[nu_foreign_education_child.Custom('FR_XSe')]."
 nu_foreign_education.0001.reflection:0 "Une adaptation demande du temps, et chacun la vit à sa manière."
 nu_foreign_education.0001.pragmatism:0 "Savoir vivre parmi eux pourra lui être utile plus tard."
 nu_foreign_education.0001.adaptation:0 "Les enfants finissent toujours par s'habituer à un nouvel environnement."
 nu_foreign_education.0001.fallback:0 "Je continuerai à suivre son évolution."

 nu_foreign_education.0010.rejection:0 "Cette amitié est une chose, oublier les siens en serait une autre."
 nu_foreign_education.0010.mistrust:0 "J'aimerais en savoir davantage sur cette nouvelle fréquentation."
 nu_foreign_education.0010.acceptance:0 "Je suis rassuré de savoir que [nu_foreign_education_child.GetFirstName] n'est pas seul[nu_foreign_education_child.Custom('FR_E')]."
 nu_foreign_education.0010.reflection:0 "Les amitiés nouées si jeune peuvent durer longtemps."
 nu_foreign_education.0010.pragmatism:0 "Une relation solide dans cette cour pourrait un jour avoir son utilité."
 nu_foreign_education.0010.adaptation:0 "Il était naturel que [nu_foreign_education_child.GetFirstName] finisse par se faire des amis."
 nu_foreign_education.0010.fallback:0 "Voilà au moins une bonne compagnie."

 nu_foreign_education.0020.rejection:0 "Ils n'ont pas à lui faire oublier qui [nu_foreign_education_child.Custom('FR_IlElle')] est."
 nu_foreign_education.0020.mistrust:0 "Voilà précisément le genre de chose que je craignais."
 nu_foreign_education.0020.acceptance:0 "J'aurais aimé pouvoir être là pour [nu_foreign_education_child.Custom('FR_LuiElle')]."
 nu_foreign_education.0020.reflection:0 "Apprendre à répondre au regard des autres fait aussi partie de l'éducation."
 nu_foreign_education.0020.pragmatism:0 "Il faut savoir quand répondre et quand laisser parler."
 nu_foreign_education.0020.adaptation:0 "Les cruautés d'enfants passent souvent aussi vite qu'elles viennent."
 nu_foreign_education.0020.fallback:0 "J'espère que cela ne prendra pas plus d'importance."

 nu_foreign_education.0030.rejection:0 "Découvrir leurs coutumes ne signifie pas devoir abandonner les nôtres."
 nu_foreign_education.0030.mistrust:0 "Je me demande jusqu'où l'on cherche à influencer [nu_foreign_education_child.GetFirstName]."
 nu_foreign_education.0030.acceptance:0 "Comprendre une autre coutume n'oblige pas à la juger."
 nu_foreign_education.0030.reflection:0 "Comparer les usages est déjà une manière d'apprendre."
 nu_foreign_education.0030.pragmatism:0 "Comprendre leurs coutumes aidera aussi à comprendre leurs décisions."
 nu_foreign_education.0030.adaptation:0 "Ce qui paraît étrange aujourd'hui semblera peut-être banal demain."
 nu_foreign_education.0030.fallback:0 "Une coutume de plus à découvrir."

 nu_foreign_education.0040.rejection:0 "Même sa manière de parler commence donc à changer."
 nu_foreign_education.0040.mistrust:0 "Certaines de ces expressions me sont déjà étrangères."
 nu_foreign_education.0040.acceptance:0 "Derrière ces nouveaux mots, je reconnais toujours mon enfant."
 nu_foreign_education.0040.reflection:0 "La langue finit naturellement par porter la trace de ceux qui nous entourent."
 nu_foreign_education.0040.pragmatism:0 "Parler comme eux aidera aussi [nu_foreign_education_child.GetFirstName] à penser avec eux."
 nu_foreign_education.0040.adaptation:0 "Quelques expressions étrangères ne changent pas une personne."
 nu_foreign_education.0040.fallback:0 "Je relirai cette lettre avec attention."

 nu_foreign_education.0050.rejection:0 "Je ne veux pas que ses deux mondes finissent par lui faire oublier le premier."
 nu_foreign_education.0050.mistrust:0 "J'espère que [nu_foreign_education_child.GetFirstName] saura encore où est sa place."
 nu_foreign_education.0050.acceptance:0 "Pourquoi devrait-il choisir, si ces deux mondes peuvent vivre en lui ?"
 nu_foreign_education.0050.reflection:0 "Peut-être est-ce précisément cette double expérience qui façonnera son identité."
 nu_foreign_education.0050.pragmatism:0 "Comprendre deux mondes est rarement un désavantage."
 nu_foreign_education.0050.adaptation:0 "On peut parfaitement appartenir un peu à deux endroits."
 nu_foreign_education.0050.fallback:0 "Le temps dira ce qu'il conservera de chacun."

 nu_foreign_education.0070.rejection:0 "[nu_foreign_education_child.GetFirstName] n'a pas été envoyé[nu_foreign_education_child.Custom('FR_E')] là-bas pour cela."
 nu_foreign_education.0070.mistrust:0 "Qui est exactement cet enfant qui attire autant son attention ?"
 nu_foreign_education.0070.acceptance:0 "Les premiers attachements ont quelque chose d'attendrissant."
 nu_foreign_education.0070.reflection:0 "Le cœur commence tôt à suivre ses propres chemins."
 nu_foreign_education.0070.pragmatism:0 "Je serais curieux de connaître la famille de cet enfant."
 nu_foreign_education.0070.adaptation:0 "Un béguin d'enfance, rien de plus naturel."
 nu_foreign_education.0070.fallback:0 "Voilà une nouvelle à laquelle je ne m'attendais pas."

 nu_foreign_education.0080.rejection:0 "Quoi qu'il en soit, [nu_foreign_education_child.GetFirstName] ne doit pas se laisser marcher dessus."
 nu_foreign_education.0080.mistrust:0 "Une querelle qui dure aussi longtemps mérite d'être surveillée."
 nu_foreign_education.0080.acceptance:0 "J'aurais préféré qu'ils apprennent à se pardonner."
 nu_foreign_education.0080.reflection:0 "Certaines inimitiés changent avec le temps, d'autres s'enracinent."
 nu_foreign_education.0080.pragmatism:0 "Même un rival apprend à connaître nos forces et nos faiblesses."
 nu_foreign_education.0080.adaptation:0 "Ils grandiront peut-être avant leur querelle."
 nu_foreign_education.0080.fallback:0 "Je garderai un œil sur cette histoire."
