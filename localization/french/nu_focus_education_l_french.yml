l_french:

 # 0100 - Diplomatie : Entre deux querelles
 nu_focus_education.0100.opening:0 "Entre deux querelles"
 nu_focus_education.0100.desc.strong:0 "[nu_foreign_education_guardian.GetFirstName] m'écrit au sujet d'une dispute qui a éclaté entre plusieurs jeunes de la cour. Plutôt que de choisir un camp, [nu_foreign_education_child.GetFirstName] s'est interposé[nu_foreign_education_child.Custom('FR_E')] et a patiemment amené chacun à exposer ses griefs. Le compromis obtenu n'était peut-être pas parfait, mais il a tenu."
 nu_focus_education.0100.desc.mixed:0 "Une querelle entre de jeunes membres de la cour a récemment attiré [nu_foreign_education_child.GetFirstName]. Son intervention n'a pas entièrement apaisé les esprits, mais [nu_foreign_education_child.Custom('FR_IlElle')] a au moins réussi à empêcher la dispute de dégénérer."
 nu_focus_education.0100.desc.bad:0 "[nu_foreign_education_child.GetFirstName] a voulu intervenir dans une querelle entre plusieurs jeunes de la cour. Ses paroles ont malheureusement ajouté de nouvelles raisons de se disputer, et [nu_foreign_education_guardian.GetFirstName] a dû mettre fin à l'incident."
 nu_focus_education.0100.desc.fallback:0 "[nu_foreign_education_guardian.GetFirstName] m'envoie quelques nouvelles de [nu_foreign_education_child.GetFirstName] et des rapports parfois difficiles entre les jeunes de la cour."
 nu_focus_education.0100.rejection:0 "On ne gagne rien à se laisser entraîner dans les querelles des autres."
 nu_focus_education.0100.mistrust:0 "Je préfère savoir avec qui [nu_foreign_education_child.GetFirstName] se mêle."
 nu_focus_education.0100.acceptance:0 "Apprendre à écouter les autres lui sera utile."
 nu_focus_education.0100.reflection:0 "Un compromis imparfait vaut parfois mieux qu'une victoire."
 nu_focus_education.0100.pragmatism:0 "Savoir mettre fin à une dispute est une compétence précieuse."
 nu_focus_education.0100.adaptation:0 "[nu_foreign_education_child.GetFirstName] apprendra à gérer ce genre de situation."
 nu_focus_education.0100.fallback:0 "Je prends note de cette leçon."

 # 0110 - Diplomatie : Un visage venu d'ailleurs
 nu_focus_education.0110.opening:0 "Un visage venu d'ailleurs"
 nu_focus_education.0110.desc.strong:0 "Un visiteur de passage à la cour a récemment retenu l'attention de [nu_foreign_education_child.GetFirstName]. Loin de rester en retrait, [nu_foreign_education_child.Custom('FR_IlElle')] a engagé la conversation avec aisance et s'est montré[nu_foreign_education_child.Custom('FR_E')] sincèrement curieu[nu_foreign_education_child.Custom('FR_XSe')] de son parcours et de ses usages."
 nu_focus_education.0110.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] a eu l'occasion d'échanger avec un visiteur étranger à la cour. La conversation fut parfois maladroite, mais suffisamment longue pour que chacun reparte avec quelque chose à raconter."
 nu_focus_education.0110.desc.bad:0 "Lorsqu'un visiteur inconnu a tenté d'adresser la parole à [nu_foreign_education_child.GetFirstName], votre enfant est resté[nu_foreign_education_child.Custom('FR_E')] sur ses gardes et n'a guère laissé la conversation commencer."
 nu_focus_education.0110.desc.fallback:0 "Un visiteur de passage a donné à [nu_foreign_education_child.GetFirstName] l'occasion de rencontrer quelqu'un venu d'un autre horizon."
 nu_focus_education.0110.rejection:0 "Il n'est pas nécessaire d'accorder sa confiance au premier venu."
 nu_focus_education.0110.mistrust:0 "J'aimerais savoir ce que cet étranger cherchait réellement."
 nu_focus_education.0110.acceptance:0 "Une rencontre sincère peut apprendre beaucoup."
 nu_focus_education.0110.reflection:0 "Comprendre un étranger commence souvent par une conversation."
 nu_focus_education.0110.pragmatism:0 "Chaque rencontre peut devenir utile un jour."
 nu_focus_education.0110.adaptation:0 "Voilà simplement une personne de plus que [nu_foreign_education_child.GetFirstName] aura appris à connaître."
 nu_focus_education.0110.fallback:0 "Une expérience de plus loin de chez nous."

 # 0120 - Martial : Le terrain plutôt que les livres
 nu_focus_education.0120.opening:0 "Le terrain plutôt que les livres"
 nu_focus_education.0120.desc.strong:0 "[nu_foreign_education_guardian.GetFirstName] rapporte que [nu_foreign_education_child.GetFirstName] comprend bien mieux certaines leçons martiales une arme d'entraînement en main que devant un traité. Après plusieurs essais, les gestes que l'on devait encore lui expliquer sont devenus beaucoup plus naturels."
 nu_focus_education.0120.desc.mixed:0 "Les exercices pratiques semblent convenir à [nu_foreign_education_child.GetFirstName]. Les progrès ne sont pas spectaculaires, mais [nu_foreign_education_child.Custom('FR_IlElle')] commence à relier la théorie apprise aux gestes qu'elle exige."
 nu_focus_education.0120.desc.bad:0 "La dernière séance d'entraînement de [nu_foreign_education_child.GetFirstName] fut surtout une leçon de discipline. Impatience, distraction et empressement ont empêché votre enfant de tirer grand-chose des exercices proposés."
 nu_focus_education.0120.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] poursuit son apprentissage martial, alternant théorie et pratique sous la surveillance de [nu_foreign_education_guardian.GetFirstName]."
 nu_focus_education.0120.rejection:0 "La discipline compte davantage que l'enthousiasme."
 nu_focus_education.0120.mistrust:0 "J'espère que personne ne prend de risques inutiles avec mon enfant."
 nu_focus_education.0120.acceptance:0 "Je suis heureux de savoir que [nu_foreign_education_child.GetFirstName] trouve sa manière d'apprendre."
 nu_focus_education.0120.reflection:0 "Chaque élève comprend différemment."
 nu_focus_education.0120.pragmatism:0 "Ce qui compte est que l'enseignement porte ses fruits."
 nu_focus_education.0120.adaptation:0 "Si le terrain lui convient mieux, qu'il en soit ainsi."
 nu_focus_education.0120.fallback:0 "Que l'entraînement continue."

 # 0130 - Martial : Un coup de trop
 nu_focus_education.0130.opening:0 "Un coup de trop"
 nu_focus_education.0130.desc.restrained:0 "Un exercice martial entre [nu_foreign_education_child.GetFirstName] et un autre jeune a failli aller trop loin. Au dernier instant, votre enfant a retenu son coup et a préféré mettre fin à l'affrontement plutôt que profiter de l'ouverture."
 nu_focus_education.0130.desc.forceful:0 "Un entraînement a récemment pris une tournure plus sérieuse que prévu. [nu_foreign_education_child.GetFirstName] n'a pas reculé et a poursuivi l'échange jusqu'au bout, au risque de transformer un simple exercice en querelle."
 nu_focus_education.0130.desc.sadistic:0 "Durant un exercice martial, [nu_foreign_education_child.GetFirstName] a pris un plaisir visible à maintenir son avantage sur un camarade déjà dépassé. [nu_foreign_education_guardian.GetFirstName] a dû rappeler que l'entraînement n'était pas une occasion d'humilier l'autre."
 nu_focus_education.0130.desc.fallback:0 "Un exercice martial entre jeunes de la cour a récemment dépassé les limites prévues, donnant à [nu_foreign_education_child.GetFirstName] une leçon que les livres auraient difficilement pu enseigner."
 nu_focus_education.0130.rejection:0 "Il faut savoir quand frapper, et quand s'arrêter."
 nu_focus_education.0130.mistrust:0 "Ce genre de jeu peut créer des ennemis durables."
 nu_focus_education.0130.acceptance:0 "J'espère surtout que personne n'en gardera de rancune."
 nu_focus_education.0130.reflection:0 "La maîtrise de soi fait autant partie de l'art du combat que la force."
 nu_focus_education.0130.pragmatism:0 "Une confrontation révèle vite les qualités et les faiblesses."
 nu_focus_education.0130.adaptation:0 "Les jeunes finissent toujours par tester leurs limites."
 nu_focus_education.0130.fallback:0 "Voilà une leçon qu'il n'oubliera pas."

 # 0140 - Intendance : Quelque chose ne compte pas
 nu_focus_education.0140.opening:0 "Quelque chose ne compte pas"
 nu_focus_education.0140.desc.strong:0 "[nu_foreign_education_child.GetFirstName] a récemment remarqué qu'une partie des ressources de la cour ne correspondait pas aux comptes présentés. Plutôt que d'accuser au hasard, votre enfant a repris les chiffres et fini par mettre le doigt sur l'erreur."
 nu_focus_education.0140.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] a eu l'intuition qu'une incohérence se cachait dans la gestion des ressources de la cour. Son premier diagnostic était imparfait, mais la recherche de l'erreur s'est révélée instructive."
 nu_focus_education.0140.desc.bad:0 "Persuadé[nu_foreign_education_child.Custom('FR_E')] d'avoir découvert une irrégularité, [nu_foreign_education_child.GetFirstName] a désigné un responsable avant même d'avoir vérifié ses calculs. L'erreur se trouvait ailleurs."
 nu_focus_education.0140.desc.fallback:0 "Une question de gestion des ressources a donné à [nu_foreign_education_child.GetFirstName] l'occasion de mettre en pratique ses leçons d'intendance."
 nu_focus_education.0140.rejection:0 "Accuser sans preuve est une faute qu'il faudra corriger."
 nu_focus_education.0140.mistrust:0 "Une erreur dans les comptes mérite toujours d'être examinée."
 nu_focus_education.0140.acceptance:0 "Même une mauvaise conclusion peut devenir une bonne leçon."
 nu_focus_education.0140.reflection:0 "Vérifier avant de juger, voilà l'essentiel."
 nu_focus_education.0140.pragmatism:0 "Savoir où disparaissent les ressources est toujours utile."
 nu_focus_education.0140.adaptation:0 "On apprend aussi l'intendance en se trompant."
 nu_focus_education.0140.fallback:0 "Je retiens surtout qu'il apprend à regarder les détails."

 # 0150 - Intendance : Faire durer les réserves
 nu_focus_education.0150.opening:0 "Faire durer les réserves"
 nu_focus_education.0150.desc.strong:0 "Face à des réserves limitées, [nu_foreign_education_child.GetFirstName] a proposé une répartition étonnamment mesurée. Votre enfant a su distinguer ce qui pouvait attendre de ce qui devait absolument être préservé."
 nu_focus_education.0150.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] a participé à une discussion sur la manière de répartir des ressources limitées. Sa solution n'était pas parfaite, mais les conséquences de chaque choix semblent lui avoir beaucoup appris."
 nu_focus_education.0150.desc.bad:0 "Chargé[nu_foreign_education_child.Custom('FR_E')] de réfléchir à la répartition de réserves limitées, [nu_foreign_education_child.GetFirstName] a surtout privilégié ce qui lui paraissait immédiatement désirable. Il faudra encore apprendre à penser au lendemain."
 nu_focus_education.0150.desc.fallback:0 "La gestion de réserves limitées a récemment servi de leçon pratique à [nu_foreign_education_child.GetFirstName]."
 nu_focus_education.0150.rejection:0 "Gaspiller ce qui manque déjà est impardonnable."
 nu_focus_education.0150.mistrust:0 "J'espère que personne ne lui enseigne à sacrifier l'essentiel."
 nu_focus_education.0150.acceptance:0 "Apprendre à partager des ressources limitées n'est jamais simple."
 nu_focus_education.0150.reflection:0 "Toute répartition révèle ce que l'on considère vraiment comme prioritaire."
 nu_focus_education.0150.pragmatism:0 "C'est exactement le genre de décision qu'un dirigeant doit savoir prendre."
 nu_focus_education.0150.adaptation:0 "L'expérience lui apprendra vite ce qui fonctionne."
 nu_focus_education.0150.fallback:0 "Une leçon d'intendance bien concrète."

 # 0160 - Intrigue : Ce n'était pas destiné à ses oreilles
 nu_focus_education.0160.opening:0 "Ce n'était pas destiné à ses oreilles"
 nu_focus_education.0160.desc.strong:0 "[nu_foreign_education_child.GetFirstName] a surpris une conversation qui n'était manifestement pas destinée à ses oreilles. Votre enfant a compris qu'une information peut parfois valoir davantage lorsqu'on ne montre pas immédiatement qu'on la possède."
 nu_focus_education.0160.desc.mixed:0 "Après avoir entendu par hasard une conversation confidentielle, [nu_foreign_education_child.GetFirstName] a choisi d'en parler à [nu_foreign_education_guardian.GetFirstName]. L'incident lui aura au moins appris que toute information possède un poids différent selon celui qui la détient."
 nu_focus_education.0160.desc.bad:0 "[nu_foreign_education_child.GetFirstName] a tenté d'écouter une conversation discrète, mais sa présence a été remarquée avant que quoi que ce soit d'utile puisse être compris. La gêne qui a suivi fut, elle, parfaitement claire."
 nu_focus_education.0160.desc.fallback:0 "Une conversation surprise par hasard a donné à [nu_foreign_education_child.GetFirstName] une première leçon sur la valeur du secret."
 nu_focus_education.0160.rejection:0 "Écouter aux portes finit rarement bien."
 nu_focus_education.0160.mistrust:0 "Je me demande ce que l'on cache autour de mon enfant."
 nu_focus_education.0160.acceptance:0 "J'espère qu'il saura surtout à qui faire confiance."
 nu_focus_education.0160.reflection:0 "Savoir quelque chose ne signifie pas qu'il faille immédiatement s'en servir."
 nu_focus_education.0160.pragmatism:0 "Une information conservée au bon moment peut avoir beaucoup de valeur."
 nu_focus_education.0160.adaptation:0 "À force de vivre à la cour, il finira forcément par entendre des choses."
 nu_focus_education.0160.fallback:0 "Voilà une leçon de cour qu'aucun maître n'enseigne vraiment."

 # 0170 - Intrigue : Je sais quelque chose que tu ignores
 nu_focus_education.0170.opening:0 "Je sais quelque chose que tu ignores"
 nu_focus_education.0170.desc.strong:0 "[nu_foreign_education_child.GetFirstName] a récemment utilisé une information obtenue à la cour pour infléchir discrètement la décision de quelqu'un. Rien de spectaculaire, simplement quelques mots placés au bon moment et la certitude de savoir ce que l'autre ignorait."
 nu_focus_education.0170.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] a tenté de négocier à partir d'une information que son interlocuteur aurait préféré garder discrète. La manœuvre est restée subtile, et votre enfant semble avoir compris qu'un levier trop visible perd vite de sa valeur."
 nu_focus_education.0170.desc.bad:0 "Convaincu[nu_foreign_education_child.Custom('FR_E')] de pouvoir manipuler quelqu'un grâce à une information indiscrète, [nu_foreign_education_child.GetFirstName] a poussé son avantage trop loin. Son interlocuteur a compris la manœuvre et n'a guère apprécié."
 nu_focus_education.0170.desc.fallback:0 "Une petite intrigue de cour a donné à [nu_foreign_education_child.GetFirstName] l'occasion de tester la différence entre savoir quelque chose et savoir s'en servir."
 nu_focus_education.0170.rejection:0 "J'espère qu'il n'apprend pas à se croire plus malin que tout le monde."
 nu_focus_education.0170.mistrust:0 "À jouer avec les secrets, on attire vite l'attention."
 nu_focus_education.0170.acceptance:0 "Je préférerais qu'il n'oublie pas ce que ses manœuvres peuvent coûter aux autres."
 nu_focus_education.0170.reflection:0 "Le meilleur levier est parfois celui que l'on n'a pas besoin d'utiliser."
 nu_focus_education.0170.pragmatism:0 "Savoir transformer une information en avantage est une qualité réelle."
 nu_focus_education.0170.adaptation:0 "La cour lui apprend ses propres règles."
 nu_focus_education.0170.fallback:0 "Il découvre vite comment fonctionnent les gens."

 # 0180 - Érudition : Deux enseignements, deux vérités
 nu_focus_education.0180.opening:0 "Deux enseignements, deux vérités"
 nu_focus_education.0180.desc.strong:0 "[nu_foreign_education_child.GetFirstName] a découvert que certaines choses enseignées à la cour diffèrent nettement de ce qu'on lui avait appris chez nous. Plutôt que de choisir immédiatement un camp, votre enfant a voulu comprendre pourquoi deux personnes instruites pouvaient tenir des positions si différentes."
 nu_focus_education.0180.desc.local:0 "Confronté[nu_foreign_education_child.Custom('FR_E')] à un enseignement différent de celui reçu chez nous, [nu_foreign_education_child.GetFirstName] semble avoir trouvé les explications locales convaincantes. [nu_foreign_education_child.Custom('FR_IlElle')|U] en retient désormais naturellement certains raisonnements."
 nu_focus_education.0180.desc.reject:0 "Face à un enseignement contraire à ce qu'on lui avait appris chez nous, [nu_foreign_education_child.GetFirstName] a refusé de céder. Votre enfant a néanmoins dû défendre sa position avec suffisamment de précision pour transformer cette résistance en véritable exercice d'érudition."
 nu_focus_education.0180.desc.fallback:0 "Deux enseignements contradictoires ont récemment donné à [nu_foreign_education_child.GetFirstName] matière à réfléchir."
 nu_focus_education.0180.rejection:0 "Il ne faut pas confondre ouverture d'esprit et abandon de ce que l'on sait vrai."
 nu_focus_education.0180.mistrust:0 "Je veux savoir exactement ce qu'on lui enseigne là-bas."
 nu_focus_education.0180.acceptance:0 "Comprendre une autre réponse n'oblige pas à renier la sienne."
 nu_focus_education.0180.reflection:0 "Deux vérités contradictoires sont parfois le début d'une vraie réflexion."
 nu_focus_education.0180.pragmatism:0 "Connaître les raisonnements des autres permet aussi de mieux les comprendre."
 nu_focus_education.0180.adaptation:0 "Il apprendra à vivre avec des réponses différentes."
 nu_focus_education.0180.fallback:0 "Voilà au moins une question qui mérite d'être étudiée."

 # 0190 - Érudition : Pourquoi ?
 nu_focus_education.0190.opening:0 "Pourquoi ?"
 nu_focus_education.0190.desc.strong:0 "Une leçon qui devait être brève s'est transformée en longue discussion lorsque [nu_foreign_education_child.GetFirstName] a commencé à demander pourquoi chaque affirmation devait être tenue pour vraie. Loin de se disperser, ses questions ont fini par pousser toute la leçon beaucoup plus loin que prévu."
 nu_focus_education.0190.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] a encore transformé une leçon simple en série de questions. Toutes n'étaient pas également pertinentes, mais cette curiosité semble au moins l'obliger à réfléchir au lieu de mémoriser passivement."
 nu_focus_education.0190.desc.bad:0 "Les questions de [nu_foreign_education_child.GetFirstName] ont récemment ressemblé moins à de la curiosité qu'à une contestation permanente de [nu_foreign_education_guardian.GetFirstName]. La discussion fut instructive, mais certainement pas reposante pour son tuteur."
 nu_focus_education.0190.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] continue à poser suffisamment de questions pour transformer certaines leçons en discussions bien plus longues que prévu."
 nu_focus_education.0190.rejection:0 "Il devra aussi apprendre qu'une leçon n'est pas un débat sans fin."
 nu_focus_education.0190.mistrust:0 "Questionner est sain, tant qu'on ne cherche pas à l'embrouiller."
 nu_focus_education.0190.acceptance:0 "Je préfère le savoir curieux plutôt qu'indifférent."
 nu_focus_education.0190.reflection:0 "Un bon pourquoi vaut parfois mieux qu'une réponse apprise par cœur."
 nu_focus_education.0190.pragmatism:0 "Celui qui comprend les raisons retient mieux les règles."
 nu_focus_education.0190.adaptation:0 "Son tuteur finira bien par s'habituer à ses questions."
 nu_focus_education.0190.fallback:0 "Au moins, il ne manque pas de curiosité."

 nu_focus_education.0140.context.nomadic:0 "\n\nDans cette cour nomade, la leçon portait moins sur des registres que sur les troupeaux, les provisions et ce qui devait être réservé pour la prochaine étape."
 nu_focus_education.0140.context.tribal:0 "\n\nIci, les comptes prenaient surtout la forme de tributs, de réserves et de biens à redistribuer entre ceux qui dépendent de la cour."
 nu_focus_education.0140.context.administrative:0 "\n\nL'exercice s'appuyait sur de véritables registres, où taxes, stocks et dépenses devaient correspondre jusque dans les moindres détails."
 nu_focus_education.0140.context.settled:0 "\n\nLa leçon portait sur les réserves, les revenus et les obligations d'une cour installée durablement."
