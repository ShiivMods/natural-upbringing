l_english:
 nu_foreign_education.0001.opening:0 "News of [nu_foreign_education_child.GetFirstName]"
 nu_foreign_education.0001.desc.integrated:0 "I wished to send you news of [nu_foreign_education_child.GetFirstName]. [nu_foreign_education_child.GetSheHe|U] now seems entirely at ease among us. Our customs are no longer foreign to [nu_foreign_education_child.GetHerHim], and at times I have to remind myself how little time [nu_foreign_education_child.GetSheHe] has actually spent at our court."
 nu_foreign_education.0001.desc.social:0 "[nu_foreign_education_child.GetFirstName] quickly found a place at court. [nu_foreign_education_child.GetSheHe|U] readily speaks with those around [nu_foreign_education_child.GetHerHim], joins the other children, and seems eager to discover something new each day."
 nu_foreign_education.0001.desc.reserved:0 "[nu_foreign_education_child.GetFirstName] still keeps somewhat apart. [nu_foreign_education_child.GetSheHe|U] watches much, speaks little, and seems to need time before granting trust. There is no cause for alarm, but adaptation is proceeding cautiously."
 nu_foreign_education.0001.desc.difficult:0 "[nu_foreign_education_child.GetFirstName] certainly does not lack character. [nu_foreign_education_child.GetSheHe|U] readily challenges what seems strange and fiercely defends the habits taught at home. The education progresses, though not without spirited discussion."
 nu_foreign_education.0001.desc.fallback:0 "I wished to reassure you about [nu_foreign_education_child.GetFirstName]. The settling-in continues normally. Much here remains new, but each week makes the court a little more familiar."
 nu_foreign_education.0001.a:0 "I am glad to have this news."

 nu_foreign_education.0010.opening:0 "An Unexpected Friendship"
 nu_foreign_education.0010.desc.reserved:0 "Something rather unexpected has happened. Despite [nu_foreign_education_child.GetHerHis] usual reserve, [nu_foreign_education_child.GetFirstName] has grown close to [nu_foreign_education_peer.GetFirstName]. They are now often seen together, sometimes simply sitting apart from the rest of the court."
 nu_foreign_education.0010.desc.social:0 "[nu_foreign_education_child.GetFirstName] and [nu_foreign_education_peer.GetFirstName] have become nearly inseparable. Games, meals, lessons, they always find some reason to be together. This friendship seems to have greatly eased your child's adjustment."
 nu_foreign_education.0010.desc.fallback:0 "I wished to inform you that [nu_foreign_education_child.GetFirstName] has formed a friendship with [nu_foreign_education_peer.GetFirstName]. Their companionship grew naturally over the passing weeks."
 nu_foreign_education.0010.a:0 "That is reassuring news."

 nu_foreign_education.0020.opening:0 "The Foreigner at Court"
 nu_foreign_education.0020.desc.withdrawn:0 "Some children at court recently mocked [nu_foreign_education_child.GetFirstNamePossessive] accent and habits. [nu_foreign_education_child.GetSheHe|U] did not answer, but kept away from the others for the rest of the day. The incident seems to have hurt more than [nu_foreign_education_child.GetSheHe] wishes to admit."
 nu_foreign_education.0020.desc.defiant:0 "Some children at court thought it amusing to mock [nu_foreign_education_child.GetFirstNamePossessive] customs. They quickly discovered that your child had no intention of letting them speak unanswered. The exchange grew heated, but the message appears to have been understood."
 nu_foreign_education.0020.desc.adapting:0 "A few jokes were made about [nu_foreign_education_child.GetFirstNamePossessive] foreign habits. To my surprise, [nu_foreign_education_child.GetSheHe] took them lightly and even turned the joke back on the others. Since then, [nu_foreign_education_child.GetSheHe] seems a little less regarded as the outsider at court."
 nu_foreign_education.0020.desc.fallback:0 "Differences in custom eventually drew a few remarks toward [nu_foreign_education_child.GetFirstName]. Nothing serious came of it, but this seems to be the first time your child truly became aware of being the foreigner here."
 nu_foreign_education.0020.a:0 "I hope the experience serves [nu_foreign_education_child.GetHerHim] well."

 nu_foreign_education.0030.opening:0 "A Strange Custom"
 nu_foreign_education.0030.desc.resistant:0 "During a local ceremony, [nu_foreign_education_child.GetFirstName] was invited to take part in one of our traditions. [nu_foreign_education_child.GetSheHe|U] agreed to attend, but made little effort to hide [nu_foreign_education_child.GetHerHis] skepticism and was quick to remind us that things are done differently at home."
 nu_foreign_education.0030.desc.curious:0 "[nu_foreign_education_child.GetFirstName] recently attended one of our local traditions. Where another child might simply have watched, yours asked question after question, eager to understand the origin of every gesture and the reason behind every custom."
 nu_foreign_education.0030.desc.enthusiastic:0 "We recently invited [nu_foreign_education_child.GetFirstName] to take part in one of our local traditions. [nu_foreign_education_child.GetSheHe|U] joined with such enthusiasm that several courtiers nearly forgot it was [nu_foreign_education_child.GetHerHis] first time."
 nu_foreign_education.0030.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] recently took part in one of our court's traditions. [nu_foreign_education_child.GetSheHe|U] was attentive and respectful, even if some of our habits still seem quite strange."
 nu_foreign_education.0030.a:0 "So another world becomes familiar."

 nu_foreign_education.0040.opening:0 "A Letter from [nu_foreign_education_child.GetFirstName]"
 nu_foreign_education.0040.desc.language:0 "“I am well. My lessons continue, and I am beginning to understand the people here much better. I will tell you everything when we see each other again.”

The letter seems ordinary enough. Yet some turns of phrase and expressions used by [nu_foreign_education_child.GetFirstName] are not ones you remember. The language and habits of the new court are clearly beginning to shape the way your child thinks."
 nu_foreign_education.0040.desc.fallback:0 "“I am well. The days are always very busy here. I will write again soon.”

There is nothing worrying in those few lines, yet something has changed. [nu_foreign_education_child.GetFirstName] now uses references and manners of speech that seem to come directly from the new court."
 nu_foreign_education.0040.a:0 "Even the words are beginning to change..."

 nu_foreign_education.0050.opening:0 "Between Two Worlds"
 nu_foreign_education.0050.desc.servants:0 "I have noticed something interesting about [nu_foreign_education_child.GetFirstName]. The people you sent along have preserved many habits of your household, while our court has taught new ones. Your child now moves between the two with remarkable ease."
 nu_foreign_education.0050.desc.deep:0 "[nu_foreign_education_child.GetFirstName] seems to live between two worlds. Some mannerisms still clearly come from home, while others now appear so natural one might think they were learned from infancy. At times it is difficult to say where one inheritance ends and the other begins."
 nu_foreign_education.0050.desc.fallback:0 "[nu_foreign_education_child.GetFirstNamePossessive] habits are becoming difficult to define. [nu_foreign_education_child.GetSheHe|U] keeps some customs from home while spontaneously adopting those of our court. The mixture no longer seems contradictory to [nu_foreign_education_child.GetHerHim]."
 nu_foreign_education.0050.a:0 "Two worlds can coexist."

 nu_foreign_education_cultural_acceptance_desc:0 "A child's education across two cultures"

 nu_foreign_education.0070.opening:0 "An Unexpected Feeling"
 nu_foreign_education.0070.desc.new:0 "At first I thought this was merely another acquaintance at court, but [nu_foreign_education_child.GetFirstName] clearly pays unusual attention to [nu_foreign_education_peer.GetFirstName]. The lingering looks and excuses to remain nearby have become difficult to ignore."
 nu_foreign_education.0070.desc.friend:0 "The friendship between [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_peer.GetFirstName] seems to have taken a new turn. Their companionship remains, but [nu_foreign_education_child.GetFirstName] plainly no longer looks upon [nu_foreign_education_peer.GetFirstName] as merely a friend."
 nu_foreign_education.0070.desc.rival:0 "The rivalry between [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_peer.GetFirstName] is becoming increasingly difficult to define. The provocations have not stopped, yet something else now seems mixed into their strange fascination with one another."
 nu_foreign_education.0070.a:0 "That is worth remembering."

 nu_foreign_education.0080.opening:0 "The Rival"
 nu_foreign_education.0080.desc.unchanged:0 "The rivalry between [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_rival.GetFirstName] shows no sign of fading. Each now seems to know exactly how to irritate the other, and neither appears willing to give ground."
 nu_foreign_education.0080.desc.friend:0 "After so many disputes, [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_rival.GetFirstName] have finally found common ground. Their old rivalry appears to have become a genuine friendship, perhaps born from the respect they learned through opposing one another."
 nu_foreign_education.0080.desc.nemesis:0 "The tension between [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_rival.GetFirstName] has crossed a new threshold. What still resembled a childish rivalry has become a deep hostility that neither lessons nor reprimands seem able to calm."
 nu_foreign_education.0080.desc.crush:0 "The rivalry between [nu_foreign_education_child.GetFirstName] and [nu_foreign_education_rival.GetFirstName] remains, but their attention toward one another now seems considerably more complicated than simple hostility."
 nu_foreign_education.0080.a:0 "Children sometimes find strange paths."

 nu_foreign_education_integrated_opinion:0 "Thriving at Court"
 nu_foreign_education_social_opinion:0 "Settling In Well"
 nu_foreign_education_difficult_opinion:0 "Difficult Adjustment"
 nu_foreign_education_parent_support_opinion:0 "Supported During Education"
 nu_foreign_education_parent_rejection_opinion:0 "Disappointed by a Parent's Reaction"

 # Parent reactions to general education news
 nu_foreign_education.0001.rejection:0 "Whatever happens there, [nu_foreign_education_child.GetFirstName] must not forget where home is."
 nu_foreign_education.0001.mistrust:0 "That court is clearly exerting a strong influence. I will remember that."
 nu_foreign_education.0001.acceptance:0 "What matters is that [nu_foreign_education_child.GetFirstName] finds a place there without being miserable."
 nu_foreign_education.0001.reflection:0 "Adjustment takes time, and every child experiences it differently."
 nu_foreign_education.0001.pragmatism:0 "Knowing how to live among them may prove useful later."
 nu_foreign_education.0001.adaptation:0 "Children eventually become used to new surroundings."
 nu_foreign_education.0001.fallback:0 "I will continue watching how things develop."

 nu_foreign_education.0010.rejection:0 "This friendship is one thing. Forgetting family would be another."
 nu_foreign_education.0010.mistrust:0 "I would like to know more about this new companion."
 nu_foreign_education.0010.acceptance:0 "I am relieved that [nu_foreign_education_child.GetFirstName] is not alone."
 nu_foreign_education.0010.reflection:0 "Friendships formed this young can last a lifetime."
 nu_foreign_education.0010.pragmatism:0 "A strong relationship at that court may prove useful one day."
 nu_foreign_education.0010.adaptation:0 "It was only natural that [nu_foreign_education_child.GetFirstName] would make friends there."
 nu_foreign_education.0010.fallback:0 "At least my child has good company."

 nu_foreign_education.0020.rejection:0 "They have no right to make my child forget who they are."
 nu_foreign_education.0020.mistrust:0 "This is precisely the sort of thing I feared."
 nu_foreign_education.0020.acceptance:0 "I wish I could have been there to offer support."
 nu_foreign_education.0020.reflection:0 "Learning to face the judgment of others is also part of growing up."
 nu_foreign_education.0020.pragmatism:0 "One must learn when to answer and when to let others talk."
 nu_foreign_education.0020.adaptation:0 "Children's cruelties often pass as quickly as they appear."
 nu_foreign_education.0020.fallback:0 "I hope the matter grows no worse."

 nu_foreign_education.0030.rejection:0 "Discovering their customs does not mean abandoning ours."
 nu_foreign_education.0030.mistrust:0 "I wonder how far they mean to influence [nu_foreign_education_child.GetFirstName]."
 nu_foreign_education.0030.acceptance:0 "Understanding another custom does not require judging it."
 nu_foreign_education.0030.reflection:0 "Comparing customs is already a form of learning."
 nu_foreign_education.0030.pragmatism:0 "Understanding their customs will also help explain their choices."
 nu_foreign_education.0030.adaptation:0 "What seems strange today may feel ordinary tomorrow."
 nu_foreign_education.0030.fallback:0 "One more custom to discover."

 nu_foreign_education.0040.rejection:0 "Even the way my child speaks is beginning to change."
 nu_foreign_education.0040.mistrust:0 "Some of these expressions already sound foreign to me."
 nu_foreign_education.0040.acceptance:0 "Behind the new words, I still recognize my child."
 nu_foreign_education.0040.reflection:0 "Language naturally carries traces of those around us."
 nu_foreign_education.0040.pragmatism:0 "Speaking like them will also help [nu_foreign_education_child.GetFirstName] understand how they think."
 nu_foreign_education.0040.adaptation:0 "A few foreign expressions do not change a person."
 nu_foreign_education.0040.fallback:0 "I will read the letter again carefully."

 nu_foreign_education.0050.rejection:0 "I do not want two worlds to make my child forget the first."
 nu_foreign_education.0050.mistrust:0 "I hope [nu_foreign_education_child.GetFirstName] will still know where home lies."
 nu_foreign_education.0050.acceptance:0 "Why should my child choose if both worlds can live within them?"
 nu_foreign_education.0050.reflection:0 "Perhaps this double experience is precisely what will shape who my child becomes."
 nu_foreign_education.0050.pragmatism:0 "Understanding two worlds is rarely a disadvantage."
 nu_foreign_education.0050.adaptation:0 "A person can belong a little to two places."
 nu_foreign_education.0050.fallback:0 "Time will tell what remains from each."

 nu_foreign_education.0070.rejection:0 "[nu_foreign_education_child.GetFirstName] was not sent there for this."
 nu_foreign_education.0070.mistrust:0 "Who exactly is this child attracting so much attention?"
 nu_foreign_education.0070.acceptance:0 "There is something touching about a first attachment."
 nu_foreign_education.0070.reflection:0 "The heart begins following its own paths early."
 nu_foreign_education.0070.pragmatism:0 "I would be interested to know that child's family."
 nu_foreign_education.0070.adaptation:0 "A childhood crush, nothing more natural."
 nu_foreign_education.0070.fallback:0 "That is not news I expected."

 nu_foreign_education.0080.rejection:0 "Whatever else happens, [nu_foreign_education_child.GetFirstName] must not be walked over."
 nu_foreign_education.0080.mistrust:0 "A quarrel lasting this long deserves attention."
 nu_foreign_education.0080.acceptance:0 "I would rather they learned to forgive one another."
 nu_foreign_education.0080.reflection:0 "Some enmities change with time. Others take root."
 nu_foreign_education.0080.pragmatism:0 "Even a rival teaches us our strengths and weaknesses."
 nu_foreign_education.0080.adaptation:0 "Perhaps they will outgrow the quarrel."
 nu_foreign_education.0080.fallback:0 "I will keep an eye on this."
