l_english:

 # 0100 - Diplomacy: Between Two Quarrels
 nu_focus_education.0100.opening:0 "Between Two Quarrels"
 nu_focus_education.0100.desc.strong:0 "[nu_foreign_education_guardian.GetFirstName] writes of a dispute that broke out among several young people at court. Rather than choose a side, [nu_foreign_education_child.GetFirstName] stepped between them and patiently led each to explain their grievance. The compromise was not perfect, but it held."
 nu_focus_education.0100.desc.mixed:0 "A quarrel among young members of the court recently drew in [nu_foreign_education_child.GetFirstName]. The intervention did not entirely calm tempers, but at least kept the dispute from becoming worse."
 nu_focus_education.0100.desc.bad:0 "[nu_foreign_education_child.GetFirstName] tried to intervene in a quarrel among several young people at court. Unfortunately, the words offered only gave them new reasons to argue, and [nu_foreign_education_guardian.GetFirstName] had to end the incident."
 nu_focus_education.0100.desc.fallback:0 "[nu_foreign_education_guardian.GetFirstName] sends news of [nu_foreign_education_child.GetFirstName] and the sometimes difficult relationships among the young people at court."
 nu_focus_education.0100.rejection:0 "Nothing is gained by being dragged into every quarrel."
 nu_focus_education.0100.mistrust:0 "I would rather know whom [nu_foreign_education_child.GetFirstName] is getting involved with."
 nu_focus_education.0100.acceptance:0 "Learning to listen to others will serve my child well."
 nu_focus_education.0100.reflection:0 "An imperfect compromise can be better than a victory."
 nu_focus_education.0100.pragmatism:0 "Knowing how to end a dispute is a valuable skill."
 nu_focus_education.0100.adaptation:0 "[nu_foreign_education_child.GetFirstName] will learn to handle such situations."
 nu_focus_education.0100.fallback:0 "I take note of the lesson."

 # 0110
 nu_focus_education.0110.opening:0 "A Face From Elsewhere"
 nu_focus_education.0110.desc.strong:0 "A visitor passing through court recently caught [nu_foreign_education_child.GetFirstNamePossessive] attention. Far from keeping back, your child entered the conversation with ease and showed genuine curiosity about the visitor's journey and customs."
 nu_focus_education.0110.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] had the opportunity to speak with a visitor unfamiliar to the court. The conversation was awkward at moments, but lasted long enough for both to leave with something to remember."
 nu_focus_education.0110.desc.bad:0 "When an unfamiliar visitor tried to speak with [nu_foreign_education_child.GetFirstName], your child remained guarded and gave the conversation little chance to begin."
 nu_focus_education.0110.desc.fallback:0 "A passing visitor gave [nu_foreign_education_child.GetFirstName] the chance to meet someone from a different background."
 nu_focus_education.0110.rejection:0 "There is no need to trust the first stranger who appears."
 nu_focus_education.0110.mistrust:0 "I would like to know what that stranger truly wanted."
 nu_focus_education.0110.acceptance:0 "A sincere meeting can teach a great deal."
 nu_focus_education.0110.reflection:0 "Understanding a stranger often begins with a conversation."
 nu_focus_education.0110.pragmatism:0 "Every meeting may prove useful one day."
 nu_focus_education.0110.adaptation:0 "Simply one more person [nu_foreign_education_child.GetFirstName] has learned to understand."
 nu_focus_education.0110.fallback:0 "Another experience far from home."

 # 0120
 nu_focus_education.0120.opening:0 "The Field Rather Than the Books"
 nu_focus_education.0120.desc.strong:0 "[nu_foreign_education_guardian.GetFirstName] reports that [nu_foreign_education_child.GetFirstName] understands certain martial lessons far better with a training weapon in hand than before a treatise. After repeated practice, movements that once required explanation have become much more natural."
 nu_focus_education.0120.desc.mixed:0 "Practical exercises seem to suit [nu_foreign_education_child.GetFirstName]. The progress is not spectacular, but your child is beginning to connect theory with the movements it is meant to guide."
 nu_focus_education.0120.desc.bad:0 "[nu_foreign_education_child.GetFirstNamePossessive] latest training session was mostly a lesson in discipline. Impatience, distraction, and haste prevented much from being gained from the exercises."
 nu_focus_education.0120.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] continues martial studies, alternating theory and practice under [nu_foreign_education_guardian.GetFirstNamePossessive] supervision."
 nu_focus_education.0120.rejection:0 "Discipline matters more than enthusiasm."
 nu_focus_education.0120.mistrust:0 "I hope nobody is taking needless risks with my child."
 nu_focus_education.0120.acceptance:0 "I am glad [nu_foreign_education_child.GetFirstName] is finding a way to learn."
 nu_focus_education.0120.reflection:0 "Every student understands differently."
 nu_focus_education.0120.pragmatism:0 "What matters is that the teaching bears fruit."
 nu_focus_education.0120.adaptation:0 "If the field suits my child better, so be it."
 nu_focus_education.0120.fallback:0 "Let the training continue."

 # 0130
 nu_focus_education.0130.opening:0 "One Blow Too Many"
 nu_focus_education.0130.desc.restrained:0 "A martial exercise between [nu_foreign_education_child.GetFirstName] and another youngster nearly went too far. At the last moment, your child held back and chose to end the exchange rather than exploit the opening."
 nu_focus_education.0130.desc.forceful:0 "A recent training session became more serious than intended. [nu_foreign_education_child.GetFirstName] did not back down and carried the exchange through to the end, risking turning a simple exercise into a quarrel."
 nu_focus_education.0130.desc.sadistic:0 "During a martial exercise, [nu_foreign_education_child.GetFirstName] took visible pleasure in maintaining an advantage over an already overwhelmed companion. [nu_foreign_education_guardian.GetFirstName] had to remind your child that training was not an excuse for humiliation."
 nu_focus_education.0130.desc.fallback:0 "A martial exercise among the young people at court recently went beyond its intended limits, giving [nu_foreign_education_child.GetFirstName] a lesson that books could hardly have provided."
 nu_focus_education.0130.rejection:0 "One must know when to strike, and when to stop."
 nu_focus_education.0130.mistrust:0 "Games like these can create lasting enemies."
 nu_focus_education.0130.acceptance:0 "I mainly hope no one holds a grudge."
 nu_focus_education.0130.reflection:0 "Self-control is as much a part of combat as strength."
 nu_focus_education.0130.pragmatism:0 "A confrontation quickly reveals strengths and weaknesses."
 nu_focus_education.0130.adaptation:0 "Young people always end up testing their limits."
 nu_focus_education.0130.fallback:0 "That is a lesson my child will remember."

 # 0140
 nu_focus_education.0140.opening:0 "Something Does Not Add Up"
 nu_focus_education.0140.desc.strong:0 "[nu_foreign_education_child.GetFirstName] recently noticed that part of the court's resources did not match the accounts presented. Rather than accuse someone at random, your child checked the figures again and eventually found the mistake."
 nu_focus_education.0140.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] suspected an inconsistency in the management of the court's resources. The first conclusion was imperfect, but searching for the error proved instructive."
 nu_focus_education.0140.desc.bad:0 "Convinced that an irregularity had been uncovered, [nu_foreign_education_child.GetFirstName] named a culprit before checking the calculations. The error lay elsewhere."
 nu_focus_education.0140.desc.fallback:0 "A question involving the court's resources gave [nu_foreign_education_child.GetFirstName] the chance to put stewardship lessons into practice."
 nu_focus_education.0140.rejection:0 "Accusing without proof is a mistake that must be corrected."
 nu_focus_education.0140.mistrust:0 "An error in the accounts always deserves examination."
 nu_focus_education.0140.acceptance:0 "Even a wrong conclusion can become a useful lesson."
 nu_focus_education.0140.reflection:0 "Check before judging, that is what matters."
 nu_focus_education.0140.pragmatism:0 "Knowing where resources disappear is always useful."
 nu_focus_education.0140.adaptation:0 "Stewardship is also learned through mistakes."
 nu_focus_education.0140.fallback:0 "At least my child is learning to notice details."

 # 0150
 nu_focus_education.0150.opening:0 "Making Supplies Last"
 nu_focus_education.0150.desc.strong:0 "Faced with limited reserves, [nu_foreign_education_child.GetFirstName] proposed a surprisingly measured distribution. Your child distinguished what could wait from what absolutely had to be preserved."
 nu_focus_education.0150.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] took part in a discussion about distributing limited resources. The solution was not perfect, but considering the consequences of each choice seems to have taught a great deal."
 nu_focus_education.0150.desc.bad:0 "Asked to consider how limited reserves should be distributed, [nu_foreign_education_child.GetFirstName] mainly favored what seemed immediately desirable. Thinking about tomorrow will take more practice."
 nu_focus_education.0150.desc.fallback:0 "Managing limited reserves recently served as a practical lesson for [nu_foreign_education_child.GetFirstName]."
 nu_focus_education.0150.rejection:0 "Wasting what is already scarce is unforgivable."
 nu_focus_education.0150.mistrust:0 "I hope no one is teaching my child to sacrifice what matters."
 nu_focus_education.0150.acceptance:0 "Learning to share limited resources is never simple."
 nu_focus_education.0150.reflection:0 "Every distribution reveals what one truly considers important."
 nu_focus_education.0150.pragmatism:0 "This is exactly the sort of decision a ruler must learn to make."
 nu_focus_education.0150.adaptation:0 "Experience will quickly teach what works."
 nu_focus_education.0150.fallback:0 "A very practical lesson in stewardship."

 # 0160
 nu_focus_education.0160.opening:0 "Not Meant for Those Ears"
 nu_focus_education.0160.desc.strong:0 "[nu_foreign_education_child.GetFirstName] overheard a conversation plainly not intended for your child's ears. Your child understood that information can sometimes be worth more when one does not immediately reveal possessing it."
 nu_focus_education.0160.desc.mixed:0 "After accidentally overhearing a private conversation, [nu_foreign_education_child.GetFirstName] chose to tell [nu_foreign_education_guardian.GetFirstName]. The incident at least taught that information carries different weight depending on who holds it."
 nu_focus_education.0160.desc.bad:0 "[nu_foreign_education_child.GetFirstName] tried to listen to a discreet conversation, but was noticed before anything useful could be understood. The embarrassment that followed was perfectly clear."
 nu_focus_education.0160.desc.fallback:0 "A conversation overheard by chance gave [nu_foreign_education_child.GetFirstName] an early lesson in the value of secrecy."
 nu_focus_education.0160.rejection:0 "Listening at doors rarely ends well."
 nu_focus_education.0160.mistrust:0 "I wonder what is being hidden around my child."
 nu_focus_education.0160.acceptance:0 "I hope my child mainly learns whom to trust."
 nu_focus_education.0160.reflection:0 "Knowing something does not mean it must immediately be used."
 nu_focus_education.0160.pragmatism:0 "Information kept for the right moment can be valuable."
 nu_focus_education.0160.adaptation:0 "Living at court long enough means hearing things."
 nu_focus_education.0160.fallback:0 "A lesson of court no tutor can truly teach."

 # 0170
 nu_focus_education.0170.opening:0 "I Know Something You Do Not"
 nu_focus_education.0170.desc.strong:0 "[nu_foreign_education_child.GetFirstName] recently used information learned at court to quietly influence someone's decision. Nothing dramatic, merely a few words placed at the right moment and the certainty of knowing what the other person did not."
 nu_focus_education.0170.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] tried to negotiate from information the other person would rather have kept private. The maneuver remained subtle, and your child seems to have learned that leverage displayed too openly quickly loses value."
 nu_focus_education.0170.desc.bad:0 "Certain of being able to manipulate someone through an indiscreet piece of information, [nu_foreign_education_child.GetFirstName] pushed the advantage too far. The other person understood the maneuver and did not appreciate it."
 nu_focus_education.0170.desc.fallback:0 "A small court intrigue gave [nu_foreign_education_child.GetFirstName] the chance to test the difference between knowing something and knowing how to use it."
 nu_focus_education.0170.rejection:0 "I hope my child is not learning to think everyone else a fool."
 nu_focus_education.0170.mistrust:0 "Playing with secrets attracts attention quickly."
 nu_focus_education.0170.acceptance:0 "I would rather my child remember what such maneuvers may cost others."
 nu_focus_education.0170.reflection:0 "The best leverage is sometimes the one never used."
 nu_focus_education.0170.pragmatism:0 "Turning information into advantage is a real skill."
 nu_focus_education.0170.adaptation:0 "The court is teaching its own rules."
 nu_focus_education.0170.fallback:0 "My child is learning quickly how people work."

 # 0180
 nu_focus_education.0180.opening:0 "Two Teachings, Two Truths"
 nu_focus_education.0180.desc.strong:0 "[nu_foreign_education_child.GetFirstName] discovered that some things taught at court differ sharply from what was taught at home. Rather than immediately choose a side, your child wanted to understand why two learned people could hold such different positions."
 nu_focus_education.0180.desc.local:0 "Faced with teaching different from what was learned at home, [nu_foreign_education_child.GetFirstName] seems to have found the local explanation convincing and now uses some of its reasoning naturally."
 nu_focus_education.0180.desc.reject:0 "Faced with teaching contrary to what was learned at home, [nu_foreign_education_child.GetFirstName] refused to yield. Your child still had to defend the position precisely enough to turn resistance into a genuine exercise in learning."
 nu_focus_education.0180.desc.fallback:0 "Two contradictory teachings recently gave [nu_foreign_education_child.GetFirstName] much to think about."
 nu_focus_education.0180.rejection:0 "Open-mindedness must not become abandonment of what one knows to be true."
 nu_focus_education.0180.mistrust:0 "I want to know exactly what they are teaching there."
 nu_focus_education.0180.acceptance:0 "Understanding another answer does not require rejecting one's own."
 nu_focus_education.0180.reflection:0 "Two contradictory truths can be the beginning of real thought."
 nu_focus_education.0180.pragmatism:0 "Knowing how others reason also makes them easier to understand."
 nu_focus_education.0180.adaptation:0 "My child will learn to live with different answers."
 nu_focus_education.0180.fallback:0 "At least that is a question worth studying."

 # 0190
 nu_focus_education.0190.opening:0 "Why?"
 nu_focus_education.0190.desc.strong:0 "A lesson meant to be brief became a long discussion when [nu_foreign_education_child.GetFirstName] began asking why each claim should be considered true. Rather than becoming distracted, the questions pushed the lesson much further than intended."
 nu_focus_education.0190.desc.mixed:0 "[nu_foreign_education_child.GetFirstName] once again turned a simple lesson into a chain of questions. Not all were equally useful, but the curiosity at least forces your child to think rather than memorize passively."
 nu_focus_education.0190.desc.bad:0 "[nu_foreign_education_child.GetFirstNamePossessive] questions recently seemed less like curiosity than constant challenge toward [nu_foreign_education_guardian.GetFirstName]. The discussion was instructive, but certainly not restful for the tutor."
 nu_focus_education.0190.desc.fallback:0 "[nu_foreign_education_child.GetFirstName] continues asking enough questions to turn some lessons into discussions far longer than intended."
 nu_focus_education.0190.rejection:0 "My child must also learn that a lesson is not an endless debate."
 nu_focus_education.0190.mistrust:0 "Questioning is healthy, as long as no one is trying to confuse my child."
 nu_focus_education.0190.acceptance:0 "I would rather see curiosity than indifference."
 nu_focus_education.0190.reflection:0 "A good why can be worth more than a memorized answer."
 nu_focus_education.0190.pragmatism:0 "Someone who understands the reasons remembers the rules better."
 nu_focus_education.0190.adaptation:0 "The tutor will eventually get used to the questions."
 nu_focus_education.0190.fallback:0 "At least curiosity is not lacking."
