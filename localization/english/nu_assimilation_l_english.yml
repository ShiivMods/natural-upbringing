l_english:

 nu_assimilation.0001.t:0 "News from [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0001.desc_rapid:0 "A letter from [nu_assimilated_child.GetFirstName] has reached me. Its lines overflow with an almost surprising enthusiasm for the customs and ways discovered far from home. In so little time, what was once a foreign world seems to have become [nu_assimilated_child.GetHerHis] own.\n\nThere can now be little doubt that [nu_assimilated_child.GetFirstName] considers [nu_assimilated_child.GetHerselfHimself] part of the [nu_assimilated_child.GetCulture.GetName] culture."
 nu_assimilation.0001.desc:0 "The latest news from [nu_assimilated_child.GetFirstName] confirms what the passing years had already begun to suggest. The habits, language, and customs of [nu_assimilated_child.GetHerHis] surroundings have gradually taken root.\n\n[nu_assimilated_child.GetFirstName] now belongs to the [nu_assimilated_child.GetCulture.GetName] culture."

 nu_assimilation.0002.t:0 "The Rite of [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0002.desc_rapid:0 "A letter from [nu_assimilated_child.GetFirstName] has reached me, filled with a new and unexpected fervor. Barely a few years have been enough for beliefs once foreign to [nu_assimilated_child.GetHerHim] to become deeply familiar.\n\n[nu_assimilated_child.GetFirstName] now follows the [nu_religious_assimilation_target.GetName] rite."
 nu_assimilation.0002.desc:0 "The letters from [nu_assimilated_child.GetFirstName] had been changing for some time. The references, prayers, and convictions woven into them had slowly begun to reveal this transformation.\n\n[nu_assimilated_child.GetFirstName] now follows the [nu_religious_assimilation_target.GetName] rite."

 nu_assimilation.0003.t:0 "A New Identity"
 nu_assimilation.0003.desc_rapid:0 "The latest letter from [nu_assimilated_child.GetFirstName] is almost unrecognizable for the intensity of the enthusiasm within it. In only a few years, the customs and beliefs of [nu_assimilated_child.GetHerHis] new surroundings seem to have been embraced completely.\n\n[nu_assimilated_child.GetFirstName] now belongs to the [nu_assimilated_child.GetCulture.GetName] culture and follows the [nu_religious_assimilation_target.GetName] faith."
 nu_assimilation.0003.desc:0 "Over time, the news from [nu_assimilated_child.GetFirstName] had begun to suggest a transformation deeper than simple adaptation to a foreign court. That change is now unmistakable.\n\n[nu_assimilated_child.GetFirstName] belongs to the [nu_assimilated_child.GetCulture.GetName] culture and follows the [nu_religious_assimilation_target.GetName] faith."

 nu_assimilation.0001.context_guardian_court_servants:0 "\n\nAnd yet, even the servants sent to preserve our customs were not enough. Under the guardianship of [nu_cultural_assimilation_guardian.GetFirstName], at the court of [nu_cultural_assimilation_court_owner.GetFirstName], this new identity ultimately took root."
 nu_assimilation.0001.context_guardian_court:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName], together with life at the court of [nu_cultural_assimilation_court_owner.GetFirstName], seems to have profoundly shaped [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_court:0 "\n\nLife at the court of [nu_cultural_assimilation_court_owner.GetFirstName] seems to have profoundly shaped [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_guardian:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName] seems to have played a decisive role in this change."

 nu_assimilation.0002.context_guardian_court_attendant:0 "\n\nEven the religious accompaniment arranged to preserve the old faith was not enough. Under the guardianship of [nu_religious_assimilation_guardian.GetFirstName], at the court of [nu_religious_assimilation_court_owner.GetFirstName], new convictions ultimately took root."
 nu_assimilation.0002.context_guardian_court:0 "\n\nThe influence of [nu_religious_assimilation_guardian.GetFirstName] and life at the court of [nu_religious_assimilation_court_owner.GetFirstName] seem to have nourished this new faith."
 nu_assimilation.0002.context_court:0 "\n\nLife at the court of [nu_religious_assimilation_court_owner.GetFirstName] seems to have gradually nourished these new convictions."
 nu_assimilation.0002.context_guardian:0 "\n\nThe influence of [nu_religious_assimilation_guardian.GetFirstName] seems to have played a decisive role in this spiritual change."

 nu_assimilation.0003.context_guardian_court:0 "\n\nUnder the guardianship of [nu_cultural_assimilation_guardian.GetFirstName], at the court of [nu_cultural_assimilation_court_owner.GetFirstName], [nu_assimilated_child.GetFirstName] seems to have found far more than a place of education."
 nu_assimilation.0003.context_court:0 "\n\nThe court of [nu_cultural_assimilation_court_owner.GetFirstName] seems to have become far more than a place of education for [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0003.context_guardian:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName] seems to have deeply shaped both the customs and convictions of [nu_assimilated_child.GetFirstName]."

# Dominant personality reactions
 nu_assimilation.0001.rejection:0 "No. [nu_assimilated_child.GetFirstName] cannot simply turn away from our customs."
 nu_assimilation.0001.mistrust:0 "What have they been putting into their head far from my sight?"
 nu_assimilation.0001.acceptance:0 "Whatever customs they follow, [nu_assimilated_child.GetFirstName] remains my child."
 nu_assimilation.0001.reflection:0 "I should understand this change before I judge it."
 nu_assimilation.0001.pragmatism:0 "This new identity may yet prove useful to them."
 nu_assimilation.0001.adaptation:0 "Customs change. Life goes on."
 nu_assimilation.0001.fallback:0 "Time will tell me what to make of this."

 nu_assimilation.0002.rejection:0 "I cannot accept [nu_assimilated_child.GetFirstName] abandoning our faith like this."
 nu_assimilation.0002.mistrust:0 "Who convinced them of all this while they were beyond my sight?"
 nu_assimilation.0002.acceptance:0 "Their conscience is their own, and [nu_assimilated_child.GetFirstName] remains my child."
 nu_assimilation.0002.reflection:0 "Faith should not be judged in anger."
 nu_assimilation.0002.pragmatism:0 "This conversion may also open doors for them."
 nu_assimilation.0002.adaptation:0 "Beliefs change with the years."
 nu_assimilation.0002.fallback:0 "I will need time to understand this change."

 nu_assimilation.0003.rejection:0 "Did everything have to disappear, our customs and our faith alike?"
 nu_assimilation.0003.mistrust:0 "[nu_assimilated_child.GetFirstName] was reshaped far from my sight."
 nu_assimilation.0003.acceptance:0 "Whatever has changed, [nu_assimilated_child.GetFirstName] remains my child."
 nu_assimilation.0003.reflection:0 "[nu_assimilated_child.GetFirstName] has changed. I should understand before I judge."
 nu_assimilation.0003.pragmatism:0 "A new identity can sometimes become an advantage."
 nu_assimilation.0003.adaptation:0 "A life may take many paths."
 nu_assimilation.0003.fallback:0 "So much has changed..."

 # Guardian notifications
 NU_GUARDIAN_ASSIMILATION_CULTURE_TITLE:0 "A New Culture for [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_CULTURE_DESC:0 "Your ward, [nu_assimilated_child.GetFirstName], now belongs to the [nu_assimilated_child.GetCulture.GetName] culture. Over the course of their education, these customs gradually became their own."

 NU_GUARDIAN_ASSIMILATION_RELIGION_TITLE:0 "A New Rite for [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_RELIGION_DESC:0 "Your ward, [nu_assimilated_child.GetFirstName], now follows the [nu_assimilated_child.GetRite.GetName] rite. Their convictions gradually evolved over the course of their education."

 NU_GUARDIAN_ASSIMILATION_BOTH_TITLE:0 "A New Identity for [nu_assimilated_child.GetFirstName]"
 NU_GUARDIAN_ASSIMILATION_BOTH_DESC:0 "Your ward, [nu_assimilated_child.GetFirstName], now belongs to the [nu_assimilated_child.GetCulture.GetName] culture and follows the [nu_assimilated_child.GetRite.GetName] rite. Their education has profoundly shaped their identity."
