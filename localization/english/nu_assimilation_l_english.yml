l_english:

 nu_assimilation.0001.t:0 "News from [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0001.desc_rapid:0 "A letter from [nu_assimilated_child.GetFirstName] has reached me. Its lines overflow with an almost surprising enthusiasm for the customs and ways discovered far from home. In so little time, what was once a foreign world seems to have become [nu_assimilated_child.GetHerHis] own.\n\nThere can now be little doubt that [nu_assimilated_child.GetFirstName] considers [nu_assimilated_child.GetHerselfHimself] part of the [nu_assimilated_child.GetCulture.GetName] culture."
 nu_assimilation.0001.desc:0 "The latest news from [nu_assimilated_child.GetFirstName] confirms what the passing years had already begun to suggest. The habits, language, and customs of [nu_assimilated_child.GetHerHis] surroundings have gradually taken root.\n\n[nu_assimilated_child.GetFirstName] now belongs to the [nu_assimilated_child.GetCulture.GetName] culture."

 nu_assimilation.0002.t:0 "The Faith of [nu_assimilated_child.GetFirstName]"
 nu_assimilation.0002.desc_rapid:0 "A letter from [nu_assimilated_child.GetFirstName] has reached me, filled with a new and unexpected fervor. Barely a few years have been enough for beliefs once foreign to [nu_assimilated_child.GetHerHim] to become deeply familiar.\n\n[nu_assimilated_child.GetFirstName] now follows the [nu_assimilated_child.GetFaith.GetName] faith."
 nu_assimilation.0002.desc:0 "The letters from [nu_assimilated_child.GetFirstName] had been changing for some time. The references, prayers, and convictions woven into them had slowly begun to reveal this transformation.\n\n[nu_assimilated_child.GetFirstName] now follows the [nu_assimilated_child.GetFaith.GetName] faith."

 nu_assimilation.0003.t:0 "A New Identity"
 nu_assimilation.0003.desc_rapid:0 "The latest letter from [nu_assimilated_child.GetFirstName] is almost unrecognizable for the intensity of the enthusiasm within it. In only a few years, the customs and beliefs of [nu_assimilated_child.GetHerHis] new surroundings seem to have been embraced completely.\n\n[nu_assimilated_child.GetFirstName] now belongs to the [nu_assimilated_child.GetCulture.GetName] culture and follows the [nu_assimilated_child.GetFaith.GetName] faith."
 nu_assimilation.0003.desc:0 "Over time, the news from [nu_assimilated_child.GetFirstName] had begun to suggest a transformation deeper than simple adaptation to a foreign court. That change is now unmistakable.\n\n[nu_assimilated_child.GetFirstName] belongs to the [nu_assimilated_child.GetCulture.GetName] culture and follows the [nu_assimilated_child.GetFaith.GetName] faith."

 nu_assimilation.0001.context_guardian_court_servants:0 "\n\nAnd yet, even the servants sent to preserve our customs were not enough. Under the guardianship of [nu_cultural_assimilation_guardian.GetFirstName], at the court of [nu_cultural_assimilation_court_owner.GetFirstName], this new identity ultimately took root."
 nu_assimilation.0001.context_guardian_court:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName], together with life at the court of [nu_cultural_assimilation_court_owner.GetFirstName], seems to have profoundly shaped [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_court:0 "\n\nLife at the court of [nu_cultural_assimilation_court_owner.GetFirstName] seems to have profoundly shaped [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0001.context_guardian:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName] seems to have played a decisive role in this change."

 nu_assimilation.0002.context_guardian_court_attendant:0 "\n\nEven the religious accompaniment arranged to preserve the old faith was not enough. Under the guardianship of [nu_religious_assimilation_guardian.GetFirstName], at the court of [nu_religious_assimilation_court_owner.GetFirstName], new convictions ultimately took root."
 nu_assimilation.0002.context_guardian_court:0 "\n\nThe influence of [nu_religious_assimilation_guardian.GetFirstName] and life at the court of [nu_religious_assimilation_court_owner.GetFirstName] seem to have nourished this new faith."
 nu_assimilation.0002.context_court:0 "\n\nLife at the court of [nu_religious_assimilation_court_owner.GetFirstName] seems to have gradually nourished these new convictions."
 nu_assimilation.0002.context_guardian:0 "\n\nThe influence of [nu_religious_assimilation_guardian.GetFirstName] seems to have played a decisive role in this spiritual change."

 nu_assimilation.0003.context_guardian_court:0 "\n\nUnder the guardianship of [nu_cultural_assimilation_guardian.GetFirstName], at the court of [nu_cultural_assimilation_court_owner.GetFirstName], [nu_assimilated_child.GetFirstName] seems to have found far more than a place of education."
 nu_assimilation.0003.context_court:0 "\n\nThe court of [nu_cultural_assimilation_court_owner.GetFirstName] seems to have become far more than a place of education for [nu_assimilated_child.GetFirstName]."
 nu_assimilation.0003.context_guardian:0 "\n\nThe influence of [nu_cultural_assimilation_guardian.GetFirstName] seems to have deeply shaped both the customs and convictions of [nu_assimilated_child.GetFirstName]."


 nu_assimilation.0001.lustful:0 "Customs change; human desires rather less."
 nu_assimilation.0001.chaste:0 "Customs may change, but a person's discipline remains their own."
 nu_assimilation.0001.gluttonous:0 "At least I hope they have not forgotten the food from home."
 nu_assimilation.0001.temperate:0 "This change deserves neither panic nor celebration."
 nu_assimilation.0001.greedy:0 "If this culture opens doors for them, they may as well profit from it."
 nu_assimilation.0001.generous:0 "I can grant them the freedom to become their own person."
 nu_assimilation.0001.lazy:0 "I am not going to fight every new habit they have picked up."
 nu_assimilation.0001.diligent:0 "If these customs have truly become theirs, it probably did not happen by accident."
 nu_assimilation.0001.wrathful:0 "They taught my child to forget where they came from?!"
 nu_assimilation.0001.calm:0 "There is no reason to lose my head over this."
 nu_assimilation.0001.patient:0 "Time will show what this new identity truly means."
 nu_assimilation.0001.impatient:0 "How many more changes am I expected to accept?"
 nu_assimilation.0001.arrogant:0 "I expected better than seeing them abandon our ways."
 nu_assimilation.0001.humble:0 "Who am I to claim that our customs must always be better?"
 nu_assimilation.0001.deceitful:0 "Perhaps they will learn to wear one identity here and another elsewhere."
 nu_assimilation.0001.honest:0 "If this is truly who they have become, better to admit it."
 nu_assimilation.0001.craven:0 "I only hope this does not bring trouble upon us."
 nu_assimilation.0001.brave:0 "Then let them carry this new identity without shame."
 nu_assimilation.0001.shy:0 "I do not even know what I am supposed to say to them about this."
 nu_assimilation.0001.gregarious:0 "Another culture does not make them a stranger."
 nu_assimilation.0001.ambitious:0 "I had other plans for them."
 nu_assimilation.0001.content:0 "They have become different. That does not mean everything is lost."
 nu_assimilation.0001.arbitrary:0 "It suits me today. Perhaps it will not tomorrow."
 nu_assimilation.0001.just:0 "I should judge who they have become, not who I expected them to be."
 nu_assimilation.0001.cynical:0 "Culture is never quite as immutable as people like to pretend."
 nu_assimilation.0001.zealous:0 "Culture may change. Their faith is another matter entirely."
 nu_assimilation.0001.paranoid:0 "Who knows what they were told far from my sight..."
 nu_assimilation.0001.trusting:0 "I must trust that this identity has truly become their own."
 nu_assimilation.0001.compassionate:0 "Whatever customs they follow, [nu_assimilated_child.GetFirstName] remains my child."
 nu_assimilation.0001.callous:0 "It was their choice. Let them live with it."
 nu_assimilation.0001.sadistic:0 "If they reject their origins, they will learn to live with the consequences."
 nu_assimilation.0001.stubborn:0 "One does not turn their back on their origins so easily."
 nu_assimilation.0001.fickle:0 "Customs change. Bonds remain."
 nu_assimilation.0001.vengeful:0 "I will not forget those who drew them away from our customs."
 nu_assimilation.0001.forgiving:0 "I will not hold it against them."
 nu_assimilation.0001.eccentric:0 "Well... that is an interesting turn of events."
 nu_assimilation.0001.fallback:0 "Time will tell me what to make of this."

 nu_assimilation.0002.lustful:0 "The gods have always had plenty to say about what we desire."
 nu_assimilation.0002.chaste:0 "I can only hope their new faith teaches them discipline."
 nu_assimilation.0002.gluttonous:0 "I hope their new priests have not forbidden everything worth eating."
 nu_assimilation.0002.temperate:0 "Faith deserves reflection, not excess."
 nu_assimilation.0002.greedy:0 "If this faith brings them allies, at least it has some use."
 nu_assimilation.0002.generous:0 "My child's conscience does not belong to me."
 nu_assimilation.0002.lazy:0 "I have no desire to spend hours arguing theology."
 nu_assimilation.0002.diligent:0 "A conviction this deep was surely not built in a single day."
 nu_assimilation.0002.wrathful:0 "They abandoned the faith in which we raised them?!"
 nu_assimilation.0002.calm:0 "I can hear this without losing my composure."
 nu_assimilation.0002.patient:0 "A lifetime of belief cannot be understood from a single letter."
 nu_assimilation.0002.impatient:0 "Another complication I could have done without."
 nu_assimilation.0002.arrogant:0 "So they believe they have found a truth better than ours."
 nu_assimilation.0002.humble:0 "Perhaps it is not for me to decide what their soul must believe."
 nu_assimilation.0002.deceitful:0 "A professed faith is not always a sincere one."
 nu_assimilation.0002.honest:0 "If they truly believe it, I would rather hear it plainly."
 nu_assimilation.0002.craven:0 "I only hope this does not put us in danger."
 nu_assimilation.0002.brave:0 "Then let them at least have the courage to stand by their faith."
 nu_assimilation.0002.shy:0 "I would rather not have to discuss this before the entire court."
 nu_assimilation.0002.gregarious:0 "Another faith is not enough to make them a stranger."
 nu_assimilation.0002.ambitious:0 "This conversion may complicate more than a few plans."
 nu_assimilation.0002.content:0 "It is not the faith I would have chosen, but so be it."
 nu_assimilation.0002.arbitrary:0 "Today I almost find it amusing. Tomorrow, who knows?"
 nu_assimilation.0002.just:0 "I should distinguish what displeases me from what is truly unjust."
 nu_assimilation.0002.cynical:0 "Do the gods truly need my approval?"
 nu_assimilation.0002.zealous:0 "They have abandoned the true faith."
 nu_assimilation.0002.paranoid:0 "That court must have put these ideas into their head."
 nu_assimilation.0002.trusting:0 "I must trust in the sincerity of their conviction."
 nu_assimilation.0002.compassionate:0 "Their faith will not change what they are to me."
 nu_assimilation.0002.callous:0 "Let them pray to whomever they wish. I care little."
 nu_assimilation.0002.sadistic:0 "If they reject our faith, they will learn what that costs."
 nu_assimilation.0002.stubborn:0 "I refuse to accept such a rejection of our beliefs."
 nu_assimilation.0002.fickle:0 "Convictions change with the years."
 nu_assimilation.0002.vengeful:0 "I will not forget those who turned them away from our faith."
 nu_assimilation.0002.forgiving:0 "I can disapprove without holding it against them forever."
 nu_assimilation.0002.eccentric:0 "The gods certainly have a strange sense of humor."
 nu_assimilation.0002.fallback:0 "I will need time to understand this change."

 nu_assimilation.0003.lustful:0 "Even with a new faith and new customs, they remain human."
 nu_assimilation.0003.chaste:0 "Everything around them has changed; I hope their discipline remains."
 nu_assimilation.0003.gluttonous:0 "Culture, faith... I only hope they know how to cook."
 nu_assimilation.0003.temperate:0 "Two changes at once are no reason to lose all sense of measure."
 nu_assimilation.0003.greedy:0 "If they can gain something from this new identity, let them."
 nu_assimilation.0003.generous:0 "I can give them the freedom to have become someone different."
 nu_assimilation.0003.lazy:0 "I certainly do not have the energy to fight every part of this change."
 nu_assimilation.0003.diligent:0 "A change this complete cannot have happened without years of effort and influence."
 nu_assimilation.0003.wrathful:0 "They took everything from them: our customs and our faith!"
 nu_assimilation.0003.calm:0 "I refuse to let anger speak for me."
 nu_assimilation.0003.patient:0 "I will need time before I understand everything this means."
 nu_assimilation.0003.impatient:0 "Did everything have to change at once?"
 nu_assimilation.0003.arrogant:0 "I can hardly believe they preferred all this to what we gave them."
 nu_assimilation.0003.humble:0 "Perhaps their path was simply never meant to look like mine."
 nu_assimilation.0003.deceitful:0 "A new identity can be worn in many different ways."
 nu_assimilation.0003.honest:0 "Better to face the truth: they are no longer the child I sent away."
 nu_assimilation.0003.craven:0 "This could make enemies for us on both sides."
 nu_assimilation.0003.brave:0 "If they chose this path, let them stand by it fully."
 nu_assimilation.0003.shy:0 "I do not even know how to begin this conversation."
 nu_assimilation.0003.gregarious:0 "[nu_assimilated_child.GetFirstName] has become different, not a stranger."
 nu_assimilation.0003.ambitious:0 "That overturns more than a few of my plans."
 nu_assimilation.0003.content:0 "As long as they find their place, I can live with this change."
 nu_assimilation.0003.arbitrary:0 "Perhaps I approve. For now."
 nu_assimilation.0003.just:0 "I should judge them fairly, even if I dislike all of this."
 nu_assimilation.0003.cynical:0 "Faith changes, customs change. Nothing is immutable."
 nu_assimilation.0003.zealous:0 "They have taken even their faith from them."
 nu_assimilation.0003.paranoid:0 "They were reshaped far from my sight."
 nu_assimilation.0003.trusting:0 "I must trust that this new identity is sincerely their own."
 nu_assimilation.0003.compassionate:0 "Whatever has changed, [nu_assimilated_child.GetFirstName] remains my child."
 nu_assimilation.0003.callous:0 "Then let them live with what they have become."
 nu_assimilation.0003.sadistic:0 "If they chose to reject us, they will learn what that costs."
 nu_assimilation.0003.stubborn:0 "They cannot simply turn their back on everything we are."
 nu_assimilation.0003.fickle:0 "A life may take many paths."
 nu_assimilation.0003.vengeful:0 "I will remember those who shaped this new identity."
 nu_assimilation.0003.forgiving:0 "I can regret this change without turning it into a rupture."
 nu_assimilation.0003.eccentric:0 "Well... that is a particularly thorough way to change."
 nu_assimilation.0003.fallback:0 "So much has changed..."
