l_english:
 nu_foreign_personality.0010.opening:0 "News of [nu_foreign_personality_child.GetFirstName]"

 nu_foreign_personality.0010.desc.lustful:0 "At a recent reception, [nu_foreign_personality_child.GetFirstName] spent much of the evening seeking the company of another young person, finding excuse after excuse to remain nearby. [nu_foreign_personality_guardian.GetFirstName] was struck by how quickly simple attention became obvious fascination.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.chaste:0 "A conversation among the young people at court recently drifted toward early flirtations and matters of the heart. [nu_foreign_personality_child.GetFirstName] quickly lost interest and chose to leave rather than join their teasing. [nu_foreign_personality_guardian.GetFirstName] now sees that reserve as characteristic.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gluttonous:0 "The kitchens eventually noticed that portions kept disappearing after meals. [nu_foreign_personality_child.GetFirstName] was discovered returning for leftovers long after the table had been cleared, showing little embarrassment at being caught.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.temperate:0 "At a banquet where the other youngsters competed for the best dishes, [nu_foreign_personality_child.GetFirstName] was content with one portion and refused another when it was offered. [nu_foreign_personality_guardian.GetFirstName] was struck by such deliberate moderation.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.greedy:0 "After lending a few coins to a companion, [nu_foreign_personality_child.GetFirstName] recorded the amount, the date, and precisely what remained owed. Days later, your child returned to claim the exact remainder without having forgotten a single detail.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.generous:0 "Several of [nu_foreign_personality_child.GetFirstNamePossessive] possessions were recently found in the hands of other children and servants. Nothing had been stolen. Your child had simply given them away to those who wanted or needed them more.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.lazy:0 "Given a small task with several other youngsters, [nu_foreign_personality_child.GetFirstName] spent more effort persuading each of them to take a share of the work than actually doing it. By the end the task was finished and your child was barely tired.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.diligent:0 "After spotting a tiny mistake in an exercise that had already been accepted, [nu_foreign_personality_child.GetFirstName] insisted on starting the entire thing again. [nu_foreign_personality_guardian.GetFirstName] has learned that work which is merely sufficient no longer satisfies your child.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.wrathful:0 "A taunt from another youngster could easily have ended there. [nu_foreign_personality_child.GetFirstName] took it as an insult, and the dispute quickly required an adult to intervene. [nu_foreign_personality_guardian.GetFirstName] notes that anger now comes quickly and fiercely.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.calm:0 "A particularly loud dispute erupted beside [nu_foreign_personality_child.GetFirstName]. While the others shouted, your child waited without raising a voice until everyone had calmed enough to listen. Such composure no longer seems accidental.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.patient:0 "A ceremony recently dragged on for hours beyond its intended length. While the other youngsters complained or tried to leave, [nu_foreign_personality_child.GetFirstName] waited without protest until the very end. [nu_foreign_personality_guardian.GetFirstName] finds the patience remarkable.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.impatient:0 "During a long explanation, [nu_foreign_personality_child.GetFirstName] finally interrupted to ask for the conclusion directly. It was not the first time waiting seemed harder to endure than whatever answer was coming.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arrogant:0 "During a group exercise, [nu_foreign_personality_child.GetFirstName] refused to follow the instructions of another youngster judged less capable. Even after being reminded who had been chosen to lead, your child remained certain of knowing better.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.humble:0 "After receiving praise for a successful task, [nu_foreign_personality_child.GetFirstName] immediately pointed out the help received and redirected the compliments toward others. [nu_foreign_personality_guardian.GetFirstName] notes that your child rarely seeks credit personally.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.deceitful:0 "After an object was damaged, [nu_foreign_personality_child.GetFirstName] constructed an explanation detailed enough to make another child appear responsible. A few carefully planted details convinced nearly everyone before the truth eventually emerged.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.honest:0 "An object at court was recently damaged with no witnesses present. Before anyone had begun searching for the culprit, [nu_foreign_personality_child.GetFirstName] came forward and admitted responsibility despite the punishment certain to follow.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.craven:0 "During an outing, a horse suddenly reared nearby. [nu_foreign_personality_child.GetFirstName] immediately took shelter and refused to approach the animal again long after all danger had passed. [nu_foreign_personality_guardian.GetFirstName] took note of the lingering fear.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.brave:0 "During an outing, a horse suddenly reared and sent several youngsters scrambling away. While others retreated, [nu_foreign_personality_child.GetFirstName] stepped forward to help bring the animal under control. The act was risky, but no one could deny the courage it required.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.shy:0 "When visitors were announced to meet the young people at court, [nu_foreign_personality_child.GetFirstName] disappeared before they even arrived. Your child was eventually found somewhere quiet, plainly preferring seclusion to any formal introduction.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gregarious:0 "At a recent reception, [nu_foreign_personality_child.GetFirstName] seemed to know someone in every group. Your child moved from one conversation to another so naturally that [nu_foreign_personality_guardian.GetFirstName] could hardly miss how comfortable constant company has become.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.ambitious:0 "After a lesson about the finest students at court, [nu_foreign_personality_child.GetFirstName] did not ask how to equal them, but how to surpass them. Since then, [nu_foreign_personality_guardian.GetFirstName] has noticed the same question behind many of your child's efforts.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.content:0 "A comparison among the possessions of several youngsters left [nu_foreign_personality_child.GetFirstName] almost indifferent. While others envied what they lacked, your child simply declared satisfaction with what was already owned.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arbitrary:0 "Two youngsters recently asked [nu_foreign_personality_child.GetFirstName] to judge two nearly identical disputes. Your child gave completely different answers, then seemed unable to understand why everyone found that surprising.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.just:0 "When a companion was punished for something they clearly had not done, [nu_foreign_personality_child.GetFirstName] insisted until the matter was reviewed. The decision had no personal effect on your child, but the injustice itself seemed impossible to ignore.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.cynical:0 "During a lesson, [nu_foreign_personality_child.GetFirstName] asked why an authority should be believed merely because it claimed to possess the truth. The discussion lasted far beyond its intended subject, and [nu_foreign_personality_guardian.GetFirstName] now doubts your child will accept many claims without examination.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.zealous:0 "During a ceremony, [nu_foreign_personality_child.GetFirstName] noticed an error in the performance of a rite and pointed it out before anyone could simply move on. [nu_foreign_personality_guardian.GetFirstName] believes faith has become too important to your child to be treated casually.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.paranoid:0 "A conversation abruptly ended when [nu_foreign_personality_child.GetFirstName] entered a room. Instead of forgetting it, your child spent the following days trying to learn who had been speaking, about what, and why they fell silent at that moment.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.trusting:0 "[nu_foreign_personality_child.GetFirstName] recently handed a cherished possession to another youngster on nothing more than a promise that it would be returned. [nu_foreign_personality_guardian.GetFirstName] was almost more surprised by the complete lack of suspicion than by the gesture itself.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.compassionate:0 "While an important task still had to be finished, [nu_foreign_personality_child.GetFirstName] abandoned it without hesitation to remain beside an injured companion. The reprimand could wait, your child explained, because someone needed help now.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.callous:0 "A youngster at court was injured during an exercise and several people rushed to help. [nu_foreign_personality_child.GetFirstName] checked that the child was being tended, then simply returned to the task as though the incident already concerned someone else.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.sadistic:0 "A game in which one child was meant to suffer a mild humiliation should have ended quickly. [nu_foreign_personality_child.GetFirstName] nevertheless tried to prolong it long after the others had lost interest, visibly amused by the victim's discomfort.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.stubborn:0 "Even after an error in the exercise had been clearly demonstrated, [nu_foreign_personality_child.GetFirstName] refused to alter the conclusion. The more others insisted, the more firmly your child defended the original position.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fickle:0 "For several days, [nu_foreign_personality_child.GetFirstName] spoke of nothing but a new passion and swore to learn everything about it. By the next day it had already been replaced by another interest defended with precisely the same conviction.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.eccentric:0 "Faced with an exercise everyone else approached in the same way, [nu_foreign_personality_child.GetFirstName] proposed a method so strange that [nu_foreign_personality_guardian.GetFirstName] first assumed it was a joke. Yet the solution worked perfectly. Such detours are becoming a habit.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.vengeful:0 "Weeks after an insult everyone else seemed to have forgotten, [nu_foreign_personality_child.GetFirstName] waited for the exact opportunity to repay its author with an almost equal humiliation. Your child had forgotten nothing, only waited.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.forgiving:0 "After a serious quarrel, several companions expected [nu_foreign_personality_child.GetFirstName] to seek revenge. Your child refused any retaliation and, only a few days later, was already speaking normally with the other youngster again.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"

 nu_foreign_personality.0010.desc.fallback:0 "A recent incident convinced [nu_foreign_personality_guardian.GetFirstName] that an aspect of [nu_foreign_personality_child.GetFirstNamePossessive] character that once seemed temporary has now become lasting.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"

 nu_foreign_personality.0010.recognition:0 "I recognize a temperament I understand well."
 nu_foreign_personality.0010.opposition:0 "That is a character I may find difficult to understand."
 nu_foreign_personality.0010.rejection:0 "I will have to make sure this trait does not grow too dominant."
 nu_foreign_personality.0010.mistrust:0 "I wonder what, over there, encouraged this change."
 nu_foreign_personality.0010.acceptance:0 "It is for [nu_foreign_personality_child.GetFirstName] to become the person they are meant to be."
 nu_foreign_personality.0010.reflection:0 "A single trait does not define a person, but it already says much."
 nu_foreign_personality.0010.pragmatism:0 "Under the right circumstances, this temperament may also become an advantage."
 nu_foreign_personality.0010.adaptation:0 "Children change as they grow. This will find its place."
 nu_foreign_personality.0010.fallback:0 "I will remember this news."
