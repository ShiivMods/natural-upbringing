l_english:
 nu_foreign_personality.0010.opening:0 "News of [nu_foreign_personality_child.GetFirstName]"
 nu_foreign_personality.0010.desc.lustful:0 "[nu_foreign_personality_child.GetFirstName] has lately shown a striking sensitivity to the people around [nu_foreign_personality_child.GetHerHim]. Attachments form quickly, glances and compliments seem to matter more than before, and that emotional intensity is becoming difficult to ignore.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.chaste:0 "[nu_foreign_personality_child.GetFirstName] seems instead to seek restraint in matters of affection. [nu_foreign_personality_child.GetSheHe|U] keeps a certain distance from flirtation and displays a reserve that other young people do not always understand.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gluttonous:0 "At meals and festivities alike, [nu_foreign_personality_child.GetFirstName] finds it increasingly difficult to resist whatever catches [nu_foreign_personality_child.GetHerHis] appetite. The kitchens already know [nu_foreign_personality_child.GetHerHim] well, and moderation remains a lesson that may need repeating.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.temperate:0 "[nu_foreign_personality_child.GetFirstName] shows remarkable restraint. Where others are easily carried away by their desires, [nu_foreign_personality_child.GetSheHe] knows when to stop, wait, and make do with what is necessary.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.greedy:0 "[nu_foreign_personality_child.GetFirstName] pays increasing attention to what belongs to [nu_foreign_personality_child.GetHerHim]. Coins, gifts, or simple possessions, little escapes notice, and [nu_foreign_personality_child.GetSheHe] parts reluctantly with anything considered [nu_foreign_personality_child.GetHerHis] own.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.generous:0 "[nu_foreign_personality_child.GetFirstName] readily shares what [nu_foreign_personality_child.GetSheHe] has, sometimes more freely than we would prefer. Servants, companions, and those in need have learned that they rarely need ask twice.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.lazy:0 "[nu_foreign_personality_child.GetFirstNamePossessive] lessons progress, though rarely with enthusiasm. [nu_foreign_personality_child.GetSheHe|U] has become particularly skilled at postponing a task or finding someone else to handle it.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.diligent:0 "It is becoming difficult to persuade [nu_foreign_personality_child.GetFirstName] to leave any task unfinished. Lessons, exercises, and duties are approached with a consistency unusual for one so young.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.wrathful:0 "[nu_foreign_personality_child.GetFirstNamePossessive] temper has clearly hardened. A small frustration may provoke sudden anger, and [nu_foreign_personality_child.GetSheHe] finds it difficult to forgive what [nu_foreign_personality_child.GetSheHe] considers an insult.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.calm:0 "Even when the court grows restless around [nu_foreign_personality_child.GetFirstName], [nu_foreign_personality_child.GetSheHe] retains remarkable composure. Disputes and provocations rarely seem enough to disturb that calm.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.patient:0 "[nu_foreign_personality_child.GetFirstName] has learned how to wait. Long lessons, endless discussions, and ordinary frustrations are endured with a patience that regularly surprises those nearby.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.impatient:0 "Waiting has become a genuine torment for [nu_foreign_personality_child.GetFirstName]. [nu_foreign_personality_child.GetSheHe|U] wants to understand, act, or obtain things immediately, and increasingly resents a world that moves more slowly than [nu_foreign_personality_child.GetHerHis] wishes.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arrogant:0 "[nu_foreign_personality_child.GetFirstName] seems fully aware of [nu_foreign_personality_child.GetHerHis] rank and qualities, perhaps a little too aware. [nu_foreign_personality_child.GetSheHe|U] now speaks with the confidence of someone who rarely doubts being right.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.humble:0 "Despite the consideration owed to [nu_foreign_personality_child.GetHerHis] birth, [nu_foreign_personality_child.GetFirstName] rarely seeks to place [nu_foreign_personality_child.GetHerselfHimself] above others. Advice is accepted, mistakes admitted, and flattery appears to hold little appeal.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.deceitful:0 "We have discovered that [nu_foreign_personality_child.GetFirstName] can conceal far more than we had assumed. A convincing excuse, a carefully incomplete truth, sometimes an outright lie, [nu_foreign_personality_child.GetSheHe] is learning quickly how to control what others believe.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.honest:0 "[nu_foreign_personality_child.GetFirstName] seems unable to leave a deception unconfessed for long. Even when the truth comes at a cost, [nu_foreign_personality_child.GetSheHe] generally prefers to say what actually happened.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.craven:0 "When faced with danger, even a modest one, [nu_foreign_personality_child.GetFirstName] now looks first for safety. Confrontation is avoided, and [nu_foreign_personality_child.GetSheHe] often seems preoccupied with everything that might go wrong.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.brave:0 "[nu_foreign_personality_child.GetFirstName] shows growing confidence in the face of danger. Where others hesitate, [nu_foreign_personality_child.GetSheHe] is often the first to move, sometimes with courage bordering on recklessness.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.shy:0 "[nu_foreign_personality_child.GetFirstName] increasingly fades into the background during large gatherings. Strangers and the attention of the court seem burdensome, and [nu_foreign_personality_child.GetSheHe] prefers a few familiar faces to a crowded hall.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.gregarious:0 "The whole court seems to know [nu_foreign_personality_child.GetFirstName]. [nu_foreign_personality_child.GetSheHe|U] constantly seeks company, starts conversations with ease, and appears genuinely unhappy when left alone for too long.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.ambitious:0 "[nu_foreign_personality_child.GetFirstNamePossessive] aspirations are becoming difficult to ignore. Merely doing well no longer seems enough, [nu_foreign_personality_child.GetSheHe] wants to be noticed, advance, and surpass those nearby.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.content:0 "[nu_foreign_personality_child.GetFirstName] seems remarkably satisfied with [nu_foreign_personality_child.GetHerHis] present place. [nu_foreign_personality_child.GetSheHe|U] asks for little, rarely envies others, and appears to appreciate what is already [nu_foreign_personality_child.GetHersHis].\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.arbitrary:0 "[nu_foreign_personality_child.GetFirstNamePossessive] decisions are becoming difficult to predict. Two nearly identical situations may receive entirely different answers depending on the mood of the moment.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.just:0 "[nu_foreign_personality_child.GetFirstName] places growing importance on rules and fairness. Even when a decision would be personally advantageous, [nu_foreign_personality_child.GetSheHe] dislikes accepting it if it seems unjust.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.cynical:0 "[nu_foreign_personality_child.GetFirstName] is increasingly unwilling to accept explanations merely because an adult or cleric gives them. Motives, beliefs, and fine words are questioned with growing skepticism.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.zealous:0 "Faith now occupies an important place in [nu_foreign_personality_child.GetFirstNamePossessive] mind. Prayers, teachings, and religious questions are approached with increasing seriousness, sometimes with a fervor that surprises even those responsible for the lessons.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.paranoid:0 "[nu_foreign_personality_child.GetFirstName] seems to search for hidden intentions behind many ordinary gestures. A closed door, a conversation cut short, or a exchanged glance can be enough to awaken suspicion.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.trusting:0 "[nu_foreign_personality_child.GetFirstName] gives trust readily to those nearby. [nu_foreign_personality_child.GetSheHe|U] is inclined to assume good intentions, sometimes even when a little more caution would be wise.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.compassionate:0 "The suffering of others affects [nu_foreign_personality_child.GetFirstName] deeply. [nu_foreign_personality_child.GetSheHe|U] readily steps in to comfort, defend, or help, even when no one asks.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.callous:0 "[nu_foreign_personality_child.GetFirstName] appears less and less moved by the misfortunes of others. [nu_foreign_personality_child.GetSheHe|U] understands what they feel, but rarely considers their feelings sufficient reason to alter [nu_foreign_personality_child.GetHerHis] course.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.sadistic:0 "Some of [nu_foreign_personality_child.GetFirstNamePossessive] behavior is beginning to concern us. [nu_foreign_personality_child.GetSheHe|U] does not always seem satisfied merely to see an opponent lose, and at times takes visible pleasure in prolonging humiliation or suffering.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.stubborn:0 "Once [nu_foreign_personality_child.GetFirstName] has made a decision, changing it becomes exceedingly difficult. Advice, argument, and even punishment often seem only to strengthen [nu_foreign_personality_child.GetHerHis] resolve.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fickle:0 "[nu_foreign_personality_child.GetFirstNamePossessive] enthusiasms change quickly. What seemed essential yesterday may be forgotten tomorrow, replaced by a new idea defended with exactly the same conviction.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.eccentric:0 "[nu_foreign_personality_child.GetFirstName] is developing habits and lines of thought entirely [nu_foreign_personality_child.GetHerHis] own. Some ideas seem brilliant, others baffling, but they nearly always follow a logic that [nu_foreign_personality_child.GetSheHe] alone appears to understand.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.vengeful:0 "[nu_foreign_personality_child.GetFirstName] forgets an offense with difficulty. Even weeks later, [nu_foreign_personality_child.GetSheHe] can still explain exactly who caused harm and why, in [nu_foreign_personality_child.GetHerHis] eyes, the debt remains unpaid.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.forgiving:0 "Grudges seem to have little hold over [nu_foreign_personality_child.GetFirstName]. Even after a serious quarrel, [nu_foreign_personality_child.GetSheHe] generally prefers to move on rather than repay harm with harm.\n\n#bold Trait gained :#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.desc.fallback:0 "[nu_foreign_personality_child.GetFirstNamePossessive] character appears to have changed durably during [nu_foreign_personality_child.GetHerHis] stay. What once seemed temporary has now become an evident part of [nu_foreign_personality_child.GetHerHis] personality.\n\n#bold Trait gained:#! [nu_foreign_personality_trait.GetName( nu_foreign_personality_child )]"
 nu_foreign_personality.0010.a:0 "So [nu_foreign_personality_child.GetHerHis] character takes shape."
